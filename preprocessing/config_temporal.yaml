preprocess:
  dataset_name: # the name of dataset
    choices: ['FaceForensics++','Celeb-DF-v1', 'Celeb-DF-v2', 'DFDCP', 'DFDC', 'DeeperForensics-1.0','UADFV']
    default: 'FaceForensics++'
  
  dataset_root_path: # the root path to the original dataset
    type: str
    default: '/home/umflint.edu/mufarooq/Umar_local_data'
    help: "Directory containing original video datasets"
  
  output_root_path: # the root path where preprocessed data will be saved
    type: str
    default: '/home/umflint.edu/mufarooq/Umar_local_data/preprocessed'
    help: "Directory where all preprocessed temporal segments will be stored (separate from original videos)"
  
  comp: # the compression level of videos, only in the dataset of FaceForensics++.
    choices: ['raw', 'c23', 'c40']
    default: 'c23'
  
  # Temporal extraction parameters
  num_segments: # number of temporal segments to extract from each video
    type: int
    default: 8
    help: "Extract N segments for temporal coverage (e.g., 8 segments)"
  
  frames_per_segment: # consecutive frames per segment
    type: int
    default: 16
    help: "Number of frames per segment (16 for VideoMAE)"
  
  frame_stride: # stride between frames within a segment
    type: int
    default: 3
    help: "Skip N-1 frames between each extracted frame (1=consecutive, 2=skip 1 frame, 3=skip 2 frames). Covers more temporal span with same frame count."

rearrange:
  dataset_name: # the name of dataset
    choices: ['FaceForensics++', 'DeepFakeDetection', 'Celeb-DF-v1', 'Celeb-DF-v2','DFDCP', 'DFDC', 'DeeperForensics-1.0','UADFV','FaceShifter']
    default: 'FaceForensics++'
  
  dataset_root_path: # the root path to the preprocessed dataset
    type: str
    default: '/home/umflint.edu/mufarooq/Umar_local_data/preprocessed'
    help: "Should point to the preprocessed output directory"
  
  output_file_path: # the json path to the dataset
    type: str
    default: '/home/umflint.edu/mufarooq/Umar_local_data/dataset_json'
  
  comp: # the compression level of videos, only in the dataset of FaceForensics++.
    choices: ['raw', 'c23', 'c40']
    default: 'c23'
  
  perturbation: # Extensive real-world perturbations are applied to DeeperForensics-1.0 dataset
    choices: ['end_to_end','end_to_end_level_1','end_to_end_level_2','end_to_end_level_3','end_to_end_level_4',
              'end_to_end_level_5','end_to_end_mix_2_distortions','end_to_end_mix_3_distortions',
              'end_to_end_mix_4_distortions','end_to_end_random_level','reenact_postprocess']
    default: 'end_to_end'

to_lmdb:
  dataset_name: # the name of dataset
    choices: ['FaceForensics++', 'DeepFakeDetection', 'Celeb-DF-v1', 'Celeb-DF-v2','DFDCP', 'DFDC', 'DeeperForensics-1.0','UADFV','FaceShifter']
    default: 'FaceForensics++'
  
  dataset_root_path: # the root path to the preprocessed dataset
    type: str
    default: '/home/umflint.edu/mufarooq/Umar_local_data/preprocessed'
    help: "Should point to the preprocessed output directory"
  
  output_lmdb_dir: # the directory where LMDB databases will be stored
    type: str
    default: '/home/umflint.edu/mufarooq/Umar_local_data/datasets_lmdbs'
  
  comp: # the compression level of videos, only in the dataset of FaceForensics++.
    choices: ['raw', 'c23', 'c40']
    default: 'c23'