# DISCERN v2 — shared branch flags.
#
# The v1 branches stay AVAILABLE but are off the v2 forward path: they are needed for
# ablations, so they are disabled by flag rather than deleted. D0 turns them back on
# explicitly (see D0_v1_reproduction.yaml) — a stripped v2 configuration must never be
# mislabelled "D0".

# ---- v1 branches: available for ablation, off the v2 forward path -------------------
semantic_v1:        false   # FACS predicate reasoning
structural_sem_v1:  false   # class-conditioned SEMs
handcrafted_freq:   false   # FFT / SRM / DCT features
ccv:                false   # CCV experiments
symbolic_rules_v1:  false   # old symbolic rules

# ---- v2 mechanisms --------------------------------------------------------------------
manifold_v2:        true
process_v2:         true

discern_v2:
  visual:
    enabled: true
    # The CLIP branch is kept unchanged for now, per the Phase-1 instructions: the phase
    # success criterion is that the new mechanisms transfer WITHOUT destroying this baseline.
    feature_dim: 512

  manifold:
    enabled: true
    # DISCERN's visual feature is 1024-d; DiCoME's f_s was 64-d and every ported projector
    # has a 32-unit hidden layer sized for that. input_dim > feature_dim inserts a linear
    # projection so the ported code runs in the regime it was validated in (a 2x bottleneck,
    # not 32x). Set input_dim: null to feed the feature straight through.
    input_dim: 1024        # DISCERN backbone / projection width
    input: projected       # 'projected' (post spatial_proj) or 'spatial_raw'
    feature_dim: 64        # DiCoME's semantic feature width f_s
    latent_dim: 32
    # SELECTED 2026-08-15 by Umar, on Track A evidence: beta_tcvae (P1b). It wins all eight
    # inverted rows, has the best standalone DF40 AUROC (0.8581), and the largest oracle
    # headroom (+0.094 BA on CDFv3).
    #
    # The D4 arm deliberately uses mr_vae (P1d) instead -- see D3_full_p1d.yaml. P1b's A2a
    # gate recovery is NEGATIVE under the FF++ threshold (-0.032 / -0.031) while P1d stays
    # positive (+0.027 / +0.265), so P1d is the only projector a gate can exploit. D4 must
    # be compared against D3_full_p1d.yaml, never against the P1b D3.
    #
    # Swapping is this one string: beta_vae | deterministic_ae | beta_tcvae | mr_vae
    projector: beta_tcvae
    export_rate_response: true
    # beta_kld MUST be 0.0 when projector = deterministic_ae. With log_var = 0 the KL term
    # becomes 0.5 * sum(mu^2) — weight decay on the latent, not "no KL".
    # assert_projector_config() enforces this.
    beta_kld: 2.0

  process:
    enabled: true
    # Frozen stabilityai/sdxl-vae, the same local checkout the P2a pilot used.
    vae_path: /data/umar/Repos/DiCoME/eval_adaptation/data/models/sdxl-vae
    resolution: 256
    # MUST match the datamodule's normalisation. DISCERN's detector configs use
    # mean = std = 0.5; the P2a pilot ran under DiCoME, which uses CLIP's constants. The
    # operator un-normalises with these before handing [-1, 1] to the AE, so wrong values
    # feed it out-of-range input and the residual becomes meaningless WITHOUT erroring.
    input_mean: [0.5, 0.5, 0.5]
    input_std:  [0.5, 0.5, 0.5]
    # Caching is deliberately NOT enabled. A residual cached from an unaugmented image
    # paired with a stochastically augmented visual input means the two branches describe
    # different observations. Reproduce P2a preprocessing exactly before optimising runtime.
    cache_residuals: false
