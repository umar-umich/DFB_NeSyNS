# =============================================================================
# Ablation 3: Spatial + Concept Evidence Branch + EDL
# =============================================================================
# Purpose: Add neuro-symbolic concept evidence on top of the spatial branch.
# The concept branch operates on precomputed semantic features (122-d) and
# consistency rules (23-d), producing independent evidence that is fused
# with the spatial branch's evidence via a learnable gate (init ~0.05).
#
# Evidence fusion:
#   spatial_evidence   = softplus(linear_head(CLIP_features))
#   concept_evidence   = softplus(concept_mlp(combined_features + rules))
#   total_evidence     = spatial_evidence + gate * concept_evidence
#   alpha = total_evidence + 1, uncertainty = K / sum(alpha)
#
# The concept branch has NO gradient path to CLIP — fully independent.
# Gate starts near 0, so training begins as pure spatial (Ablation 1).
#
# Changes from Ablation 2:
#   - ablation_mode: concept_edl
#   - Loads precomputed fast(58) + vlm(64) = 122-d combined features
#   - ConceptBranch: 145-d -> 64 -> 2 evidence
#   - Evidence fusion gate (init -3.0, sigmoid ≈ 0.05)
# =============================================================================

log_dir: /data/umar/Repos/DFB_NeSyNS/logs

model_name: nesydefake_hybrid
backbone_name: multi_stream

# -- Ablation flags -----------------------------------------------------------
ablation_spatial_only: false
ablation_mode: concept_edl

# -- EDL config ---------------------------------------------------------------
edl:
  num_classes: 2
  annealing_epochs: 10
  kl_weight: 0.15
  avu_weight: 0.1                 # AVU calibration: penalize confident-wrong

# -- Concept branch config ----------------------------------------------------
concept_branch:
  enabled: true
  combined_dim: 58
  rules_dim: 12
  hidden_dim: 64
  dropout: 0.2

# -- Evidence gate -------------------------------------------------------------
evidence_gate:
  concept_init: -0.5            # sigmoid ≈ 0.38 — concept gate barely moved at -1.0

# -- Dataset ------------------------------------------------------------------
dataset_type: nesydefake
active_branches: ['spatial']

train_dataset: [FaceForensics++]
test_dataset:  [FaceForensics++, Celeb-DF-v2]
all_dataset:   [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter,
                DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC,
                DeeperForensics-1.0, UADFV]

compression: c23

# -- Frame config -------------------------------------------------------------
video_mode: false
frame_num:
  train: 32
  test:  32

resolution:    224
with_mask:     false
with_landmark: false
load_semantic_features: false

class_weights: [1.8, 0.6]    # [real, fake] — stronger push against fake bias

# -- Cross-dataset regularizers (GenD recipe) --------------------------------
label_smoothing: 0.0
uniformity_alignment:
  enabled: false
  alignment_weight:  1.0
  uniformity_weight: 1.0
  alignment_power:   2.0
  uniformity_t:      2.0

projection_dropout:
  spatial:   0.0
  frequency: 0.0

# -- Data loading & augmentation (GenD) ---------------------------------------
train_batchSize: 256
test_batchSize:  512
workers:         12

use_data_augmentation: true
balance_classes:       false
balance_target_ratio: 0.5
paired_training: true

data_aug:
  flip_prob:            0.5
  rotate_limit:         [-10, 10]
  affine_translate:     [0.1, 0.1]
  affine_scale:         [0.9, 1.1]
  blur_prob:            0.1
  blur_kernel_size:     7
  blur_sigma:           [0.1, 2.0]
  brightness_limit:     0.1
  contrast_limit:       0.1
  quality_lower:        65
  quality_upper:        100
  gaussian_noise_sigma: 0.0

mean: [0.5, 0.5, 0.5]
std:  [0.5, 0.5, 0.5]

# -- Precomputed semantic features (for concept branch) -----------------------
# Fast semantic features only (58-d) — VLM features removed from framework.
fast_semantic:
  enabled: true
  output_dim: 58
  precomputed_dir: fast_semantic

consistency_rules:
  enabled: true
  output_dim: 12

# -- Foundation Models (GenD) -------------------------------------------------
foundation_models:
  spatial:
    name:            clip
    model_path:      openai/clip-vit-large-patch14
    output_dim:      1024
    freeze_backbone: true
    train_layernorms: true
    normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

  frequency:
    name:             fad_dinov2
    model_path:       facebook/dinov2-large
    output_dim:       1024
    freeze_backbone:  true
    train_layernorms: false
    fad_mode:         single
    fad_learnable:    true
    freq_emphasis_init: 0.1
    normalization:
      keep_raw:       true
    clip_normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

fusion:
  type:           attention
  fused_dim:      1024
  projection_dim: 1024
  dropout:        0.0

forensic_features:
  enabled: false
  output_dim: 83
  precomputed_dir: forensic_features
# -- Classifier (GenD linear probe) ------------------------------------------
classifier:
  type:         multi_task
  input_dim:    1024
  linear_probe: true
  tasks:
    - name:        classification
      type:        binary
      output_dim:  2
      loss_weight: 1.0
  hidden_dims: [512, 256]
  dropout:     0.3

# -- Loss (EDL — weights kept for compat) ------------------------------------
loss_func:
  classification:         cross_entropy
  sparse_penalty:         l1_norm
  weights:
    classification:     1.0

loss_warmup: {}

# -- Optimizer ----------------------------------------------------------------
optimizer:
  type: adam
  adam:
    lr: 0.0003
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0
    amsgrad: false
  module_lr:
    backbone_layernorms: 0.0003
    always_trainable:    0.0003
    phase_proj:          0.0003
    projection_heads:    0.0003
    fusion:              0.0003
    classifier:          0.0003
    concept_branch:      0.001   # concept branch learns faster

# -- Schedule (GenD) ----------------------------------------------------------
lr_scheduler:   cosine_warmup
warmup_epochs:  1
nEpochs:        50
start_epoch:    0
save_epoch:     1
rec_iter:       100
logdir:         ./logs
manualSeed:     1024
save_ckpt:      true
save_feat:      true
grad_clip:      1.0
freq_grad_clip: 2.0

# -- Metrics ------------------------------------------------------------------
metric_scoring:     auc
additional_metrics: [acc, eer, ap]

interpretability:
  save_attention_maps:      false
  save_causal_graphs:       false
  save_feature_activations: false
  save_sae_features:        false
  visualization_frequency:  500
  graph_viz_top_k:          20
  graph_viz_every_n_epochs: 5

# -- Hardware -----------------------------------------------------------------
cuda:            true
cudnn:           true
mixed_precision: true

checkpoint:
  save_best_only: false
  save_interval: 5
  monitor:        val_auc
  mode:           max

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.001
