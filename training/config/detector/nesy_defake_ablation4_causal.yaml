# =============================================================================
# Ablation 4: Spatial + Concept + Simplified Causal + EDL (Full NeSy)
# =============================================================================
# Purpose: Full neuro-symbolic pipeline with explainable causal graphs.
# Builds on Ablation 3 by adding a simplified causal branch that learns
# structural causal models (SCMs) for identity and forensic sub-graphs.
#
# Evidence fusion (3 sources):
#   spatial_evidence = softplus(linear_head(CLIP_features))
#   concept_evidence = softplus(concept_mlp(122-d + 23 rules))
#   causal_evidence  = softplus(residual_mlp(differential SCM residuals))
#   total = spatial + gate1 * concept + gate2 * causal
#
# Causal sub-graphs (spatial-only, linear SCM):
#   Identity:  z(32) + curated(51) + rules(23) = 106 nodes
#   Forensic:  z(32) + forensic(30) = 62 nodes
#   4 SCMs total (real/fake x identity/forensic)
#
# Changes from Ablation 3:
#   - Adds forensic_features (30-d precomputed)
#   - Adds SimplifiedCausalBranch with 4 linear SCMs
#   - Adds causal evidence gate (init -3.0)
#   - DAG acyclicity + sparsity penalty in loss
# =============================================================================

log_dir: /data/umar/Repos/DFB_NeSyNS/logs

model_name: nesydefake_hybrid
backbone_name: multi_stream

# -- Ablation flags -----------------------------------------------------------
ablation_spatial_only: false
ablation_mode: causal_edl

# -- EDL config ---------------------------------------------------------------
edl:
  num_classes: 2
  annealing_epochs: 10
  kl_weight: 0.1
  avu_weight: 0.0

# -- Concept branch config ----------------------------------------------------
concept_branch:
  enabled: true
  combined_dim: 122
  rules_dim: 23
  hidden_dim: 64
  dropout: 0.2

# -- Simplified causal branch config ------------------------------------------
causal_branch:
  enabled: true
  backbone_dim: 1024
  z_causal_dim: 32
  curated_dim: 51
  rules_dim: 23
  forensic_dim: 83
  hidden_dim: 64
  sparsity_penalty: 0.01
  dag_penalty_weight: 0.05       # weight for DAG loss in total loss

# -- Evidence gates ------------------------------------------------------------
evidence_gate:
  concept_init: -3.0            # sigmoid ≈ 0.05
  causal_init:  -3.0            # sigmoid ≈ 0.05

# -- Dataset ------------------------------------------------------------------
dataset_type: nesydefake
active_branches: ['spatial']

train_dataset: [FaceForensics++]
test_dataset:  [FaceForensics++, Celeb-DF-v2]
all_dataset:   [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter,
                DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC,
                DeeperForensics-1.0, UADFV]

compression: c23

# -- Frame config -------------------------------------------------------------
video_mode: false
frame_num:
  train: 32
  test:  32

resolution:    224
with_mask:     false
with_landmark: false
load_semantic_features: false

projection_dropout:
  spatial:   0.0
  frequency: 0.0

# -- Data loading & augmentation (GenD) ---------------------------------------
train_batchSize: 256
test_batchSize:  512
workers:         12

use_data_augmentation: true
balance_classes:       false
balance_target_ratio: 0.5
paired_training: true

data_aug:
  flip_prob:            0.5
  rotate_limit:         [-10, 10]
  affine_translate:     [0.1, 0.1]
  affine_scale:         [0.9, 1.1]
  blur_prob:            0.1
  blur_kernel_size:     7
  blur_sigma:           [0.1, 2.0]
  brightness_limit:     0.1
  contrast_limit:       0.1
  quality_lower:        40
  quality_upper:        100
  gaussian_noise_sigma: 0.0

mean: [0.5, 0.5, 0.5]
std:  [0.5, 0.5, 0.5]

# -- Precomputed features (for concept + causal branches) ---------------------
# VLM/facellava_semantic features not yet extracted — disabled for now.
# When ready, set enabled: true to use [fast(58) || vlm(64)] = 122-d.
# Until then, VLM portion is zero-filled automatically.
semantic_attributes:
  enabled: false
  backend: precomputed
  precomputed_dim: 211
  precomputed_dir: facellava_semantic
  output_dim: 211
  model_path: /data/umar/Repos/FaceBench
  use_llm: true
  fp16: true
  micro_batch_size: 16

fast_semantic:
  enabled: true
  output_dim: 58
  precomputed_dir: fast_semantic

use_refined_features: true      # 122-d combined [fast(58) || vlm(64)]

consistency_rules:
  enabled: true
  output_dim: 23

forensic_features:
  enabled: true
  output_dim: 83
  precomputed_dir: forensic_features

# -- Foundation Models (GenD) -------------------------------------------------
foundation_models:
  spatial:
    name:            clip
    model_path:      openai/clip-vit-large-patch14
    output_dim:      1024
    freeze_backbone: true
    train_layernorms: true
    normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

  frequency:
    name:             fad_dinov2
    model_path:       facebook/dinov2-large
    output_dim:       1024
    freeze_backbone:  true
    train_layernorms: false
    fad_mode:         single
    fad_learnable:    true
    freq_emphasis_init: 0.1
    normalization:
      keep_raw:       true
    clip_normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

fusion:
  type:           attention
  fused_dim:      1024
  projection_dim: 1024
  dropout:        0.0

# -- ALL old NeSy modules DISABLED --------------------------------------------
uniformity_alignment:
  enabled: false
semantic_gate:
  enabled: false
causal_intervention:
  enabled: false
  output_dim: 28
  top_k_interventions: 10
  graph_guided_alpha: 0.5
  ci_gate_init: -2.0
semantic_projection:
  enabled: false
  hidden_dim: 128
  dropout: 0.2
  gate_init: -1.0
causal_attention:
  attn_dim: 256
causal_module:
  enabled: false
  causal_warmup_batches: -1
  latent_variables:
    z_spatial_dim:    128
    z_frequency_dim:  128
    z_causal_dim:     32
  semantic_dim: 122
  dual_subgraph: true
  discovery:
    algorithm:              dagma_dce
    scm_type:               linear
    max_parents:            3
    sparsity_penalty:       0.01
    jacobian_every_n:       4
    enforce_directionality: true
  semantic_graph:
    enabled:    false
    hidden_dim: 64
    num_layers: 2
  dag_learning:
    hidden_dim:          128
    num_layers:          2
    learning_rate:       0.001
    dag_penalty_weight:  0.1
sparse_features:
  enabled: false
  per_branch: false
  dict_size: 1024
  target_k: 128
  dead_feature_window: 200
  aux_loss_coeff: 0.2
  normalize_inputs: true
  sparse_autoencoder:
    input_dim:              1024
    expansion_factor:       1
    sparsity_penalty:       0.05
    l1_coefficient:         0.001
    target_active_features: 128
  discovered_features:
    save_interpretations: true
    top_k_features:       10

# -- Classifier (GenD linear probe) ------------------------------------------
classifier:
  type:         multi_task
  input_dim:    1024
  linear_probe: true
  tasks:
    - name:        classification
      type:        binary
      output_dim:  2
      loss_weight: 1.0
  hidden_dims: [512, 256]
  dropout:     0.3

# -- Loss (EDL + DAG penalty) ------------------------------------------------
loss_func:
  classification:         cross_entropy
  sparse_penalty:         l1_norm
  weights:
    classification:     1.0
    causal:             0.0
    sparse:             0.0
    causal_semantic:    0.0
    graph_divergence:   0.0

loss_warmup: {}

# -- Optimizer ----------------------------------------------------------------
optimizer:
  type: adam
  adam:
    lr: 0.0003
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0
    amsgrad: false
  module_lr:
    backbone_layernorms: 0.0003
    always_trainable:    0.0003
    phase_proj:          0.0003
    projection_heads:    0.0003
    fusion:              0.0003
    classifier:          0.0003
    concept_branch:      0.001
    causal_branch:       0.001

# -- Schedule (GenD) ----------------------------------------------------------
lr_scheduler:   cosine_warmup
warmup_epochs:  1
nEpochs:        50
start_epoch:    0
save_epoch:     1
rec_iter:       100
logdir:         ./logs
manualSeed:     1024
save_ckpt:      true
save_feat:      true
grad_clip:      1.0
freq_grad_clip: 2.0

# -- Metrics ------------------------------------------------------------------
metric_scoring:     auc
additional_metrics: [acc, eer, ap]

interpretability:
  save_attention_maps:      false
  save_causal_graphs:       true  # Enable for explainability
  save_feature_activations: false
  save_sae_features:        false
  visualization_frequency:  500
  graph_viz_top_k:          20
  graph_viz_every_n_epochs: 5

# -- Hardware -----------------------------------------------------------------
cuda:            true
cudnn:           true
mixed_precision: true

checkpoint:
  save_best_only: false
  save_interval: 5
  monitor:        val_auc
  mode:           max

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.001
