# =============================================================================
# Ablation 4c-OTF: CLIP + concept + CCV causal, HYBRID forensic extraction
# =============================================================================
# Purpose: Kill the pixel-level train/test mismatch caused by the backbone
# seeing an augmented frame every epoch while precomputed forensic features
# were derived from the ORIGINAL unaugmented frame.
#
# Strategy (see dataset/pixel_forensic_extractor.py for the rationale):
#
#   fast_semantic (58-d)  — precomputed, kept as-is.
#     These are face-level semantic invariants (gender, age, pose, emotion,
#     AUs, landmarks). They are augmentation-robust in practice: a flipped,
#     blurred, JPEG-60 face is still the same gender/age/emotion.
#     Running InsightFace + DeepFace + LibreFace + MediaPipe in DataLoader
#     workers is infeasible (multi-GB GPU duplication × 12 workers, TF-fork
#     breakage, ~300ms/image). The mismatch here is small; the cost is huge.
#
#   forensic_features (83-d) — HYBRID:
#     - Indices 0..29  loaded from precomputed .pt (SegFormer parsing +
#       InsightFace/MediaPipe quality scores; not cheap enough for OTF).
#     - Indices 30..82 recomputed LIVE on the augmented numpy image by
#       PixelForensicExtractor (PPNC / CCNC / SRM / multi-scale noise / FFT).
#       Pure cv2/numpy/scipy, ~15-20ms/image in each DataLoader worker.
#       These are the features the augmentation (blur, JPEG, brightness,
#       noise) actually destroys, so matching them to the augmented view is
#       where the generalisation gain lives.
#
# Class weights: [1.0, 1.0] — the previous [1.8, 0.6] was compensating for
# missing fake-specific signal in spatial_edl. With concept + CCV back on we
# get that signal from the symbolic branches, so the weight tilt overshoots
# and hurts fake accuracy (acc_fake collapses on CDF in spatial_edl OTF run).
# =============================================================================

log_dir: /data/umar/Repos/DFB_NeSyNS/logs

model_name: nesydefake_hybrid
backbone_name: multi_stream

# -- Ablation flags -----------------------------------------------------------
ablation_spatial_only: false
ablation_mode: causal_edl    # concept + CCV causal branches ON (hybrid OTF forensic)

# -- EDL config (NeSy-EDL: CMEF + PBAS + IBDC) --------------------------------
edl:
  num_classes: 2
  annealing_epochs: 10
  kl_weight: 0.15
  avu_weight: 0.1
  nesy_fusion: true
  aux_weight: 0.1
  disagreement_weight: 0.05

# -- Concept branch -----------------------------------------------------------
concept_branch:
  enabled: true
  combined_dim: 58                   # fast only (no VLM 64-d)
  rules_dim: 23
  hidden_dim: 64
  dropout: 0.2

# -- CCV causal branch --------------------------------------------------------
causal_branch:
  enabled: true
  type: ccv
  combined_dim: 58
  rules_dim: 23
  forensic_dim: 83
  backbone_dim: 1024
  num_constraints: 16
  constraint_hidden: 48
  forensic_bottleneck: 8
  cf_z_dim: 32
  cf_hidden_dim: 64
  evidence_hidden: 64
  dropout: 0.2
  dag_penalty_weight: 0.0

# -- Evidence gates (unused when branches are disabled) -----------------------
evidence_gate:
  concept_init: -0.5
  causal_init:  -0.8

# -- Dataset ------------------------------------------------------------------
dataset_type: nesydefake
active_branches: ['spatial']

train_dataset: [FaceForensics++]
test_dataset:  [FaceForensics++, Celeb-DF-v2]
all_dataset:   [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter,
                DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC,
                DeeperForensics-1.0, UADFV]

compression: c23

# -- Frame config -------------------------------------------------------------
video_mode: false
frame_num:
  train: 32
  test:  32

resolution:    224
with_mask:     false
with_landmark: false
load_semantic_features: false

class_weights: [1.0, 1.0]    # neutral — symbolic branches supply fake signal

projection_dropout:
  spatial:   0.0
  frequency: 0.0

# -- Data loading & augmentation (GenD) ---------------------------------------
# Image augmentation is applied ON-THE-FLY (dataset._load_single_frame:551).
# Every epoch each frame sees a new random aug. The pixel-level slice of the
# forensic vector (indices 30..82) is recomputed from the augmented image in
# the worker, so those features match the view the backbone sees.
# fast_semantic (58-d) and forensic indices 0..29 stay precomputed.
train_batchSize: 172
test_batchSize:  172
workers:         12

use_data_augmentation: true
balance_classes:       false
balance_target_ratio: 0.5
paired_training: true

data_aug:
  flip_prob:            0.5
  rotate_limit:         [-10, 10]
  affine_translate:     [0.1, 0.1]
  affine_scale:         [0.9, 1.1]
  blur_prob:            0.15          # slightly higher than novlm for generalization
  blur_kernel_size:     7
  blur_sigma:           [0.1, 2.0]
  brightness_limit:     0.15          # slightly higher for domain robustness
  contrast_limit:       0.15
  quality_lower:        50            # lower JPEG floor → harder compression augmentation
  quality_upper:        100
  gaussian_noise_sigma: 0.01          # light noise to improve OOD robustness

mean: [0.5, 0.5, 0.5]
std:  [0.5, 0.5, 0.5]

# -- Features: fast_semantic precomputed, forensic HYBRID (OTF pixel slice) ---
# semantic_attributes (FaceBench VLM) stays OFF — this is the novlm variant.
semantic_attributes:
  enabled: false
  backend: precomputed
  precomputed_dim: 64
  precomputed_dir: facebench_semantic
  output_dim: 64

# fast_semantic: precomputed. Face semantic attributes are augmentation-robust
# (gender, age, pose, emotion, AUs) so the precomputed→augmented-view mismatch
# is small. Running InsightFace+DeepFace+LibreFace+MediaPipe in DataLoader
# workers is not feasible (see header).
fast_semantic:
  enabled: true
  output_dim: 58
  precomputed_dir: fast_semantic

use_refined_features: false

consistency_rules:
  enabled: true
  output_dim: 23

# forensic_features: HYBRID. pixel_otf=True tells the dataset to keep
# indices 0..29 from the .pt file (SegFormer-dependent region features) and
# recompute indices 30..82 (PPNC/CCNC/SRM/noise/FFT) live on the augmented
# image via training/dataset/pixel_forensic_extractor.py.
forensic_features:
  enabled: true
  output_dim: 83
  precomputed_dir: forensic_features
  pixel_otf: true

# -- Foundation Models (GenD) -------------------------------------------------
foundation_models:
  spatial:
    name:            clip
    model_path:      openai/clip-vit-large-patch14
    output_dim:      1024
    freeze_backbone: true
    train_layernorms: true
    normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

  frequency:
    name:             fad_dinov2
    model_path:       facebook/dinov2-large
    output_dim:       1024
    freeze_backbone:  true
    train_layernorms: false
    fad_mode:         single
    fad_learnable:    true
    freq_emphasis_init: 0.1
    normalization:
      keep_raw:       true
    clip_normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

fusion:
  type:           attention
  fused_dim:      1024
  projection_dim: 1024
  dropout:        0.0

# -- ALL old NeSy modules DISABLED --------------------------------------------
uniformity_alignment:
  enabled: false
semantic_gate:
  enabled: false
causal_intervention:
  enabled: false
  output_dim: 28
  top_k_interventions: 10
  graph_guided_alpha: 0.5
  ci_gate_init: -2.0
semantic_projection:
  enabled: false
  hidden_dim: 128
  dropout: 0.2
  gate_init: -1.0
causal_attention:
  attn_dim: 256
causal_module:
  enabled: false
  causal_warmup_batches: -1
  latent_variables:
    z_spatial_dim:    128
    z_frequency_dim:  128
    z_causal_dim:     32
  semantic_dim: 58
  dual_subgraph: true
  discovery:
    algorithm:              dagma_dce
    scm_type:               linear
    max_parents:            3
    sparsity_penalty:       0.01
    jacobian_every_n:       4
    enforce_directionality: true
  semantic_graph:
    enabled:    false
    hidden_dim: 64
    num_layers: 2
  dag_learning:
    hidden_dim:          128
    num_layers:          2
    learning_rate:       0.001
    dag_penalty_weight:  0.1
sparse_features:
  enabled: false
  per_branch: false
  dict_size: 1024
  target_k: 128
  dead_feature_window: 200
  aux_loss_coeff: 0.2
  normalize_inputs: true
  sparse_autoencoder:
    input_dim:              1024
    expansion_factor:       1
    sparsity_penalty:       0.05
    l1_coefficient:         0.001
    target_active_features: 128
  discovered_features:
    save_interpretations: true
    top_k_features:       10

# -- Classifier (GenD linear probe) ------------------------------------------
classifier:
  type:         multi_task
  input_dim:    1024
  linear_probe: true
  tasks:
    - name:        classification
      type:        binary
      output_dim:  2
      loss_weight: 1.0
  hidden_dims: [512, 256]
  dropout:     0.3

# -- Loss (EDL only — no DAG penalty, no branch supervision) ------------------
loss_func:
  classification:         cross_entropy
  sparse_penalty:         l1_norm
  weights:
    classification:     1.0
    causal:             0.0
    sparse:             0.0
    causal_semantic:    0.0
    graph_divergence:   0.0

loss_warmup: {}

# -- Optimizer ----------------------------------------------------------------
optimizer:
  type: adam
  adam:
    lr: 0.0003
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0001    # slight L2 to improve generalization (was 0.0)
    amsgrad: false
  module_lr:
    backbone_layernorms: 0.0003
    always_trainable:    0.0003
    phase_proj:          0.0003
    projection_heads:    0.0003
    fusion:              0.0003
    classifier:          0.0003
    concept_branch:      0.001
    causal_branch:       0.001

# -- Schedule (GenD) ----------------------------------------------------------
lr_scheduler:   cosine_warmup
warmup_epochs:  1
nEpochs:        100
start_epoch:    0
save_epoch:     1
rec_iter:       100
logdir:         ./logs
manualSeed:     42            # different seed from novlm (1024) for comparison
save_ckpt:      true
save_feat:      true
grad_clip:      1.0
freq_grad_clip: 2.0

# -- Metrics ------------------------------------------------------------------
metric_scoring:     auc
additional_metrics: [acc, eer, ap]

interpretability:
  save_attention_maps:      false
  save_causal_graphs:       false
  save_feature_activations: false
  save_sae_features:        false
  visualization_frequency:  500
  graph_viz_top_k:          20
  graph_viz_every_n_epochs: 5

# -- Hardware -----------------------------------------------------------------
cuda:            true
cudnn:           true
mixed_precision: true

checkpoint:
  save_best_only: false
  save_interval: 5
  monitor:        val_auc
  mode:           max

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.001
