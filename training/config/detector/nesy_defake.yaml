# =============================================================================
# NeSyDeFake Hybrid Detector — Configuration (v5 — dual sub-graph causal)
# =============================================================================
# v5 changes (2026-03-23):
#   - Dual sub-graph causal: identity-causal (103 nodes) + forensic-pixel (62 nodes)
#   - Two-stage z compression: backbone(1024) → z_feature(128) → z_causal(32)
#   - Curated 51 FaceBench attributes for identity sub-graph
#   - Consistency rules: 18→20 training + 13 inference intervention rules
#   - 8 total causal graphs (2 branches × 2 sub-graphs × 2 distributions)
# v4 changes:
#   - Removed dead modules: ViolationScorer, ConceptPredictionHead
#   - Causal gate init: -3.0 (sigmoid≈0.05, conservative start)
#   - SAE dict_size: 4096 → 1024 (fix 95% dead features)
#   - Graph divergence re-added at small weight (0.01)
#   - Per-tier normalization for semantic feature categories
# =============================================================================

log_dir: /data/umar/Repos/DFB_NeSyNS/logs_debug/nesydefake_hybrid

model_name: nesydefake_hybrid
backbone_name: multi_stream

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
dataset_type: nesydefake
active_branches: ['spatial', 'frequency']

train_dataset: [FaceForensics++]
test_dataset:  [FaceForensics++, Celeb-DF-v2, Celeb-DF-v1, DFDC, UADFV, DeepFakeDetection]
all_dataset:   [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter,
                DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC,
                DeeperForensics-1.0, UADFV]

compression: c23

# -----------------------------------------------------------------------------
# Frame configuration
# -----------------------------------------------------------------------------
video_mode: false
frame_num:
  train: 32
  test:  32

resolution:    224
with_mask:     false
with_landmark: false

load_semantic_features: false

class_weights: [0.7, 1.3]    # slight fake emphasis to reduce cross-dataset real bias

projection_dropout:
  spatial:   0.2
  frequency: 0.1

# -----------------------------------------------------------------------------
# Data loading & augmentation
# -----------------------------------------------------------------------------
train_batchSize: 120
test_batchSize:  120
workers:         12

use_data_augmentation: false
balance_classes:       false
balance_target_ratio: 0.5

# Source-paired training (GenD, WACV 2026)
paired_training: true

data_aug:
  flip_prob:            0.5
  rotate_limit:         [-10, 10]
  affine_translate:     [0.1, 0.1]
  affine_scale:         [0.9, 1.1]
  blur_prob:            0.1
  blur_kernel_size:     7
  blur_sigma:           [0.1, 2.0]
  brightness_limit:     0.1
  contrast_limit:       0.1
  quality_lower:        40
  quality_upper:        100
  gaussian_noise_sigma: 0.0

mean: [0.5, 0.5, 0.5]
std:  [0.5, 0.5, 0.5]

# -----------------------------------------------------------------------------
# Foundation Models
# -----------------------------------------------------------------------------
foundation_models:

  spatial:
    name:            clip
    model_path:      openai/clip-vit-large-patch14
    output_dim:      1024
    freeze_backbone: true
    train_layernorms: false
    normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

  frequency:
    name:             fad_dinov2
    model_path:       facebook/dinov2-large
    output_dim:       1024
    freeze_backbone:  true
    train_layernorms: false
    fad_mode:         single
    fad_learnable:    true
    freq_emphasis_init: 0.1
    normalization:
      keep_raw:       true
    clip_normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

# Fusion
fusion:
  type:           attention
  fused_dim:      2048
  projection_dim: 1024
  dropout:        0.3

# -----------------------------------------------------------------------------
# Uniformity-Alignment Loss (Wang & Isola, 2020 / GenD, WACV 2026)
# -----------------------------------------------------------------------------
uniformity_alignment:
  enabled: true
  alignment_weight: 0.1
  uniformity_weight: 0.5
  l2_normalize: true

# -----------------------------------------------------------------------------
# Semantic Feature Gate (generalization)
# -----------------------------------------------------------------------------
semantic_gate:
  enabled: true

# -----------------------------------------------------------------------------
# Facial Semantic Attributes (precomputed Face-LLaVA)
# -----------------------------------------------------------------------------
semantic_attributes:
  enabled: true
  backend: precomputed
  precomputed_dim: 211
  precomputed_dir: facebench_semantic
  output_dim: 211
  model_path: /data/umar/Repos/FaceBench
  use_llm: true
  fp16: true
  micro_batch_size: 16

# -----------------------------------------------------------------------------
# Fast Semantic Features (InsightFace + MediaPipe + DeepFace + py-feat)
# -----------------------------------------------------------------------------
# 58-d per frame: demographics(3), expression(8), AUs(23), pose(3),
#   gaze(4), geometry(10), quality(7). Precomputed ~30ms/frame.
fast_semantic:
  enabled: true
  output_dim: 58
  precomputed_dir: fast_semantic

# Refined features: combine fast(58) + VLM subset(64) = 122-d combined vector.
# When true, dataset loader selects 64 VLM attrs from 211 FaceBench and
# concatenates with 58 fast features. Consistency rules v7 operate on this.
use_refined_features: true

# -----------------------------------------------------------------------------
# Tier 1: Cross-Attribute Consistency Rules (forensic)
# -----------------------------------------------------------------------------
# v7: 23 differentiable violation scores on 122-d combined vector.
# Expression-AU coherence (9), cross-region identity mismatch (5),
# VLM conflicts (3), skin/age (2), pose-gaze (1), landmark symmetry (2),
# image quality (1).
consistency_rules:
  enabled: true
  output_dim: 23

# -----------------------------------------------------------------------------
# Tier 2: Pixel-Level Forensic Features (precomputed)
# -----------------------------------------------------------------------------
# Boundary gradients, regional blur, L/R symmetry, color consistency,
# frequency anomaly, quality metrics — extracted via SegFormer face parsing.
forensic_features:
  enabled: true           # Enable after running precompute_forensic_features.py
  output_dim: 83
  precomputed_dir: forensic_features

# -----------------------------------------------------------------------------
# Tier 3: Causal Intervention Module (train + inference)
# -----------------------------------------------------------------------------
# Neuro-symbolic reasoning via cross-graph scoring + do-calculus interventions.
# 28 features: 8 cross-graph + 16 intervention stats + 4 differential response.
# Computed under no_grad (no gradient to SCMs); ci_projection trains via cls loss.
causal_intervention:
  enabled: false
  output_dim: 28
  top_k_interventions: 10
  graph_guided_alpha: 0.5     # blend confidence (α) + graph importance (1-α)
  ci_gate_init: -2.0          # sigmoid≈0.12, grows as module learns

# -----------------------------------------------------------------------------
# Semantic Projection (direct semantic → classifier pathway)
# -----------------------------------------------------------------------------
# Projects the 175-d gated semantic vector (122 combined + 23 consistency v7 +
# 30 forensic) directly into the classifier space. This gives the classifier
# explicit access to facial attribute signals — the causal module captures
# anomaly patterns, while this pathway captures attribute presence/absence.
semantic_projection:
  enabled: false
  hidden_dim: 128          # bottleneck: 261 → 128 → 1024
  dropout: 0.2
  gate_init: -1.0          # sigmoid≈0.27, grows with training

# -----------------------------------------------------------------------------
# Causal Attention Fusion
# -----------------------------------------------------------------------------
# The fused CLIP features (query) attend over the 4 causal residuals
# (keys/values), dynamically selecting which are most informative.
causal_attention:
  attn_dim: 256

# -----------------------------------------------------------------------------
# Module 3: Causal Discovery
# -----------------------------------------------------------------------------
causal_module:
  enabled: false
  causal_warmup_batches: -1          # -1 = use all training batches

  # z-dimensions: two-stage compression for causal graphs.
  # Stage 1: SparseFeatureSelector projects 1024-d backbone → z_feature (128).
  # Stage 2: CausalCompressor projects z_feature (128) → z_causal (32).
  # Identity sub-graph: z_causal(32) + curated_attrs(51) + rules(20) = 103 nodes.
  # Forensic sub-graph: z_causal(32) + forensic_feats(83) = 115 nodes.
  # Both within DAGMA's validated range (20-120 nodes).
  latent_variables:
    z_spatial_dim:    128
    z_frequency_dim:  128
    z_causal_dim:     32

  semantic_dim: 122    # updated by detector at init (122+23+30=175)

  # Dual sub-graph architecture (v5):
  # - Identity-Causal: 51 curated attrs from 122-d combined + 23 consistency rules v7
  #   (gender→facial_hair, age→skin, expression→AU, pose→gaze causal chains)
  # - Forensic-Pixel: 30 precomputed forensic features
  #   (blur→boundary→frequency artifact chains)
  # Total: 8 graphs (2 branches × 2 sub-graphs × 2 distributions)
  dual_subgraph: true

  discovery:
    algorithm:              dagma_dce
    scm_type:               linear   # linear SCM for identifiable structure
    max_parents:            3
    sparsity_penalty:       0.01
    jacobian_every_n:       4        # irrelevant for linear (exact adjacency)
    enforce_directionality: true     # block latent→forensic edges

  # Semantic-only graph disabled (v2): demographics don't belong in
  # causal graph; forensic features already capture inter-attribute
  # relationships via consistency rules.
  semantic_graph:
    enabled:    false
    hidden_dim: 64
    num_layers: 2

  dag_learning:
    hidden_dim:          128
    num_layers:          2
    learning_rate:       0.001
    dag_penalty_weight:  0.1

# -----------------------------------------------------------------------------
# Module 4: Sparse Monosemantic Features (SAE)
# -----------------------------------------------------------------------------
# v4: Reduced dict_size 4096→1024 to fix 95% dead features.
# With 1024 features and target_k=128, ~12.5% are active per sample,
# making it much harder for features to die.
sparse_features:
  enabled: false
  per_branch: false
  dict_size: 1024              # was 4096 — 95% dead features
  target_k: 128
  dead_feature_window: 200
  aux_loss_coeff: 0.2
  normalize_inputs: true

  # Legacy config (kept for backward compat)
  sparse_autoencoder:
    input_dim:              1024
    expansion_factor:       1       # updated to match dict_size=1024
    sparsity_penalty:       0.05
    l1_coefficient:         0.001
    target_active_features: 128
  discovered_features:
    save_interpretations: true
    top_k_features:       10

# -----------------------------------------------------------------------------
# Module 5: Classifier (classification only)
# -----------------------------------------------------------------------------
classifier:
  type:       multi_task
  input_dim:  1024

  tasks:
    - name:        classification
      type:        binary
      output_dim:  2
      loss_weight: 1.0

  hidden_dims: [512, 256]
  dropout:     0.3              # reduced from 0.4

# -----------------------------------------------------------------------------
# Loss function (v4: cleaned up — only active losses)
# -----------------------------------------------------------------------------
loss_func:
  classification:         cross_entropy
  sparse_penalty:         l1_norm
  weights:
    classification:     1.0
    causal:             0.01
    sparse:             0.01
    causal_semantic:    0.01
    graph_divergence:   0.001

# Loss weight warm-up
# Causal learning from epoch 0 — raw backbone features are informative
# enough for graph discovery from the start.
loss_warmup:
  causal:
    start_epoch: 0
    end_epoch: 15
    start_weight: 0.001
    end_weight: 0.1
  causal_fake:
    start_epoch: 0
    end_epoch: 15
    start_weight: 0.0005
    end_weight: 0.05
  sparse:
    start_epoch: 0
    end_epoch: 10
    start_weight: 0.01
    end_weight: 0.1
  causal_semantic:
    start_epoch: 0
    end_epoch: 15
    start_weight: 0.001
    end_weight: 0.05
  graph_divergence:
    start_epoch: 0
    end_epoch: 15
    start_weight: 0.001
    end_weight: 0.01

# -----------------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------------
optimizer:
  type: adam
  adam:
    lr: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0001
    amsgrad: false
  module_lr:
    backbone_layernorms: 0.0001
    always_trainable:    0.0001
    phase_proj:          0.0003
    projection_heads:    0.0001
    fusion:              0.0002
    classifier:          0.0002

# -----------------------------------------------------------------------------
# Training schedule
# -----------------------------------------------------------------------------
lr_scheduler:   cosine_warmup
warmup_epochs:  2
nEpochs:        30
start_epoch:    0
save_epoch:     1
rec_iter:       100
logdir:         ./logs
manualSeed:     1024
save_ckpt:      true
save_feat:      true
grad_clip:      1.0
freq_grad_clip: 2.0

# Single-phase training: all modules train from epoch 0.
# Backbone LNs are unfrozen at init (GenD-style, see spatial/freq extractor configs).
# Causal gate init=-3.0 (sigmoid≈0.05) naturally suppresses causal influence early on.
# Causal warmup runs before epoch 0 to pre-populate EMA buffers.

# -----------------------------------------------------------------------------
# Metrics & interpretability
# -----------------------------------------------------------------------------
metric_scoring:     auc
additional_metrics: [acc, eer, ap]

interpretability:
  save_attention_maps:      true
  save_causal_graphs:       true
  save_feature_activations: true
  save_sae_features:        true
  visualization_frequency:  500
  graph_viz_top_k:          20
  graph_viz_every_n_epochs: 5

# -----------------------------------------------------------------------------
# Hardware
# -----------------------------------------------------------------------------
cuda:            true
cudnn:           true
mixed_precision: true

checkpoint:
  save_best_only: false
  save_interval: 5
  monitor:        val_auc
  mode:           max

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.001
