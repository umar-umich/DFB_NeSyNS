# =============================================================================
# NeSyDeFake Hybrid Detector — Configuration (FRAME-LEVEL, Step 5)
# =============================================================================
# Changelog (Step 5 — frame-level rewrite):
#   - video_mode: false — each sample is a single frame
#   - Temporal branch REMOVED from active_branches and foundation_models
#   - Removed: temporal_consistency_weight/margin (no temporal dimension)
#   - Removed: clip_size (not needed in frame mode)
#   - Added: load_semantic_features: true (73-d per-frame cached features)
#   - Updated: fused_dim = 2 branches x 1024 = 2048
#   - Updated: batch sizes increased (single frame vs 32-frame clip = ~32x less memory)
#   - train.py choose_optimizer updated: no temporal_extractor/temporal_proj groups
# =============================================================================

log_dir: /data/umar/Repos/DFB_NeSyNS/logs_debug/nesydefake_hybrid

model_name: nesydefake_hybrid
backbone_name: multi_stream

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
dataset_type: nesydefake

# Only spatial and frequency — temporal removed
active_branches: ['spatial', 'frequency']

train_dataset: [FaceForensics++]
test_dataset:  [FaceForensics++, Celeb-DF-v2]
all_dataset:   [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter,
                DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC,
                DeeperForensics-1.0, UADFV]

compression: c23

# -----------------------------------------------------------------------------
# Frame configuration (no video/temporal mode)
# -----------------------------------------------------------------------------
video_mode: false         # frame-level — each sample is one frame
frame_num:
  train: 32               # how many frames to sample per video (each becomes its own sample)
  test:  32

resolution:    224
with_mask:     false
with_landmark: false

# Semantic features from preprocessing (73-d per frame)
load_semantic_features: true

class_weights: [1.0, 1.0]     # [real_weight, fake_weight]

# ── Per-branch projection dropout ─────────────────────────────────────
projection_dropout:
  spatial:   0.2              # highest: overfits most
  frequency: 0.1

# -----------------------------------------------------------------------------
# Data loading & augmentation
# -----------------------------------------------------------------------------
# Batch sizes can be much larger now: 1 frame vs 32-frame clip
train_batchSize: 128
test_batchSize:  128
workers:         8

use_data_augmentation: true
balance_classes:       true

# It should be just 4 times not that much, to avoid real overfitting...
data_aug:
  flip_prob:        0.5
  rotate_prob:      0.5
  rotate_limit:     [-10, 10]
  blur_prob:        0.5
  blur_limit:       [3, 7]
  brightness_prob:  0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit:   [-0.1, 0.1]
  quality_lower:    40
  quality_upper:    100

# Global normalization fallback
mean: [0.5, 0.5, 0.5]
std:  [0.5, 0.5, 0.5]

# -----------------------------------------------------------------------------
# Foundation Models (spatial + frequency only)
# -----------------------------------------------------------------------------
# Input to both branches: (B, C=3, H=224, W=224) — single frames
# Each branch applies its own Linear(raw_dim -> projection_dim) before fusion.

foundation_models:

  spatial:
    name:            clip
    model_path:      openai/clip-vit-large-patch14
    output_dim:      1024
    freeze_backbone: true
    train_layernorms: true
    normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

  frequency:
    name:             fad_clip
    model_path:       openai/clip-vit-large-patch14
    output_dim:       1024
    freeze_backbone:  true
    train_layernorms: true
    fad_mode:         single
    fad_learnable:    true
    freq_emphasis_init: 0.1
    normalization:
      keep_raw:       true
    clip_normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

# Fusion
# -----------------------------------------------------------------------------
# fused_dim = 2 active branches x 1024 projection_dim = 2048
# build_backbone() patches this at runtime.
fusion:
  type:           attention          # 'attention' or 'concat'
  fused_dim:      2048    # patched at runtime by build_backbone()
  projection_dim: 1024
  dropout:        0.3

# -----------------------------------------------------------------------------
# Module 2: Semantic Grounding (replaced by cached semantic features)
# -----------------------------------------------------------------------------
semantic_grounding:
  enabled: false

# -----------------------------------------------------------------------------
# Module 3: Causal Discovery
# -----------------------------------------------------------------------------
causal_module:
  enabled: false          # enable after SAE training + semantic extraction complete

  # Causal variable dimensions (frame-level):
  #   Z_sae: 128 spatial SAE + 128 frequency SAE = 256
  #   S_semantic: 73 per-frame attributes (no temporal summaries)
  #   Total: 329 causal variables
  latent_variables:
    z_spatial_dim:    128
    z_frequency_dim:  128
    total_sae_dim:    256

  semantic_dim: 73        # per-frame semantic features from preprocessing

  discovery:
    algorithm:        dagma_dce
    max_parents:      3
    sparsity_penalty: 0.01

  dag_learning:
    hidden_dim:          128
    num_layers:          3
    learning_rate:       0.001
    dag_penalty_weight:  0.1

# -----------------------------------------------------------------------------
# Module 4: Sparse Monosemantic Features
# -----------------------------------------------------------------------------
sparse_features:
  enabled: false
  sparse_autoencoder:
    input_dim:              1024   # matches fusion.projection_dim
    expansion_factor:       4
    sparsity_penalty:       0.05
    l1_coefficient:         0.001
    target_active_features: 50
  discovered_features:
    save_interpretations: true
    top_k_features:       10

# -----------------------------------------------------------------------------
# Module 5: Multi-task Classifier
# -----------------------------------------------------------------------------
classifier:
  type:       multi_task
  input_dim:  1024   # matches fusion.projection_dim

  tasks:
    - name:        classification
      type:        binary
      output_dim:  2
      loss_weight: 1.0
    - name:        uncertainty
      type:        regression
      output_dim:  1
      loss_weight: 0.5
    - name:        violation_score
      type:        regression
      output_dim:  1
      loss_weight: 0.3

  hidden_dims: [512, 256]
  dropout:     0.4

# -----------------------------------------------------------------------------
# Loss function
# -----------------------------------------------------------------------------
loss_func:
  classification:         cross_entropy
  probabilistic_circuits: expected_calibration_error
  causal_consistency:     violation_penalty
  sparse_penalty:         l1_norm
  weights:
    classification: 1.0
    uncertainty:    0.5
    causal:         0.3
    sparse:         0.1

# -----------------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------------
optimizer:
  type: adam
  adam:
    lr: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false
  module_lr:
    backbone_layernorms: 0.00001    # GenD regime — LNs adapt slowly
    always_trainable:    0.0001     # freq_norm etc.
    phase_proj:          0.0003     # phase->RGB mapping from scratch
    projection_heads:    0.0001     # spatial_proj, frequency_proj
    fusion:              0.0002
    classifier:          0.0002

# -----------------------------------------------------------------------------
# Training schedule
# -----------------------------------------------------------------------------
lr_scheduler:   cosine_warmup
warmup_epochs:  2
nEpochs:        50
start_epoch:    0
save_epoch:     1
rec_iter:       100
logdir:         ./logs
manualSeed:     1024
save_ckpt:      true
save_feat:      true
grad_clip:      1.0

# Training phases — no temporal, so phase2 just unfreezes spatial+frequency LNs
training_phases:
  phase1:
    epochs:        [0, 5]
    freeze_modules: [foundation_models]
    train_modules:  [fusion, classifier]
    description:   "Warm up fusion and classifier with frozen backbones"
  phase2:
    epochs: [5, 10]
    freeze_modules: []
    train_modules:  [layernorms_and_heads]
    description: "Unfreeze backbone LayerNorms for GenD-style adaptation"
  phase3:
    epochs:        [10, 50]
    freeze_modules: []
    train_modules:  [all]
    enable_causal:  true
    description:   "Enable causal discovery — set causal_module.enabled=true"

# -----------------------------------------------------------------------------
# Metrics & interpretability
# -----------------------------------------------------------------------------
metric_scoring:     auc
additional_metrics: [acc, eer, ap, uncertainty_calibration]

interpretability:
  save_attention_maps:      true
  save_causal_graphs:       true
  save_feature_activations: true
  visualization_frequency:  500

# -----------------------------------------------------------------------------
# Hardware
# -----------------------------------------------------------------------------
cuda:            true
cudnn:           true
mixed_precision: true

checkpoint:
  save_best_only: false
  monitor:        val_auc
  mode:           max