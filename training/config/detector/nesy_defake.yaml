# =============================================================================
# NeSyDeFake Hybrid Detector — Configuration (FRAME-LEVEL + SAE, Step 5b)
# =============================================================================
# Changelog (Step 5b — SAE integration):
#   - sparse_features.enabled: true (SAE now active)
#   - Added: dict_size, target_k, dead_feature_window, aux_loss_coeff, normalize_inputs
#   - SAE operates on raw CLIP features (pre-projection, 1024-d)
#   - SAE loss weight: 0.1 (tunable — start low so SAE doesn't dominate early)
#   - Added SAE to optimizer (optional_modules group, base LR)
# =============================================================================

log_dir: /data/umar/Repos/DFB_NeSyNS/logs_debug/nesydefake_hybrid

model_name: nesydefake_hybrid
backbone_name: multi_stream

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
dataset_type: nesydefake
active_branches: ['spatial', 'frequency']

train_dataset: [FaceForensics++]
test_dataset:  [FaceForensics++, Celeb-DF-v2]
all_dataset:   [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter,
                DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC,
                DeeperForensics-1.0, UADFV]

compression: c23

# -----------------------------------------------------------------------------
# Frame configuration
# -----------------------------------------------------------------------------
video_mode: false
frame_num:
  train: 32
  test:  32

resolution:    224
with_mask:     false
with_landmark: false

load_semantic_features: true

class_weights: [1.0, 1.0]

projection_dropout:
  spatial:   0.2
  frequency: 0.1

# -----------------------------------------------------------------------------
# Data loading & augmentation
# -----------------------------------------------------------------------------
train_batchSize: 128
test_batchSize:  128
workers:         8

use_data_augmentation: true
balance_classes:       true
balance_target_ratio: 0.35   # tune: 0.5=full balance, 0.35=soft, 0.25=mild

data_aug:
  flip_prob:        0.5   # keep — class-neutral
  rotate_prob:      0.3   # keep but reduce slightly
  rotate_limit:     [-10, 10]
  blur_prob:        0.1   # reduce from 0.5 — blur mimics fake compression artifacts
  blur_limit:       [3, 5]  # reduce max kernel
  brightness_prob:  0.5   # keep — class-neutral
  brightness_limit: [-0.1, 0.1]
  contrast_limit:   [-0.1, 0.1]
  quality_lower:    80    # raise floor significantly — low quality = fake artifact
  quality_upper:    100

mean: [0.5, 0.5, 0.5]
std:  [0.5, 0.5, 0.5]

# -----------------------------------------------------------------------------
# Foundation Models
# -----------------------------------------------------------------------------
foundation_models:

  spatial:
    name:            clip
    model_path:      openai/clip-vit-large-patch14
    output_dim:      1024
    freeze_backbone: true
    train_layernorms: true
    normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

  frequency:
    name:             fad_clip
    model_path:       openai/clip-vit-large-patch14
    output_dim:       1024
    freeze_backbone:  true
    train_layernorms: true
    fad_mode:         single
    fad_learnable:    true
    freq_emphasis_init: 0.1
    normalization:
      keep_raw:       true
    clip_normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

# Fusion
fusion:
  type:           attention 
  fused_dim:      2048
  projection_dim: 1024
  dropout:        0.3

# -----------------------------------------------------------------------------
# Module 2: Semantic Grounding (replaced by cached semantic features)
# -----------------------------------------------------------------------------
semantic_grounding:
  enabled: false

# -----------------------------------------------------------------------------
# Module 3: Causal Discovery
# -----------------------------------------------------------------------------
causal_module:
  enabled: false          # enable after SAE converges (phase 3)

  # Z_sae: 4096 spatial + 4096 frequency = 8192 total SAE dict features
  # But only ~128+128=256 are active per sample (sparse!)
  # S_semantic: 73 per-frame attributes
  # The causal graph learns over the ACTIVE feature subset
  latent_variables:
    z_spatial_dim:    128    # target_k per branch
    z_frequency_dim:  128
    total_sae_dim:    256    # active features, not dict_size

  semantic_dim: 73

  discovery:
    algorithm:        dagma_dce
    max_parents:      3
    sparsity_penalty: 0.01

  dag_learning:
    hidden_dim:          128
    num_layers:          3
    learning_rate:       0.001
    dag_penalty_weight:  0.1

# -----------------------------------------------------------------------------
# Module 4: Sparse Monosemantic Features (SAE)
# =============================================================================
# Architecture: Per-branch BatchTopK SAE
#   - Spatial CLIP (1024) -> dict_size=4096, target_k=128 active features
#   - Frequency CLIP (1024) -> dict_size=4096, target_k=128 active features
#
# BatchTopK (Bussmann et al., 2024):
#   - Selects top (k * batch_size) activations across the batch
#   - Average ~128 active per sample, but adaptive per-sample
#   - No L1 coefficient tuning needed (direct sparsity control)
#
# Training: Joint with detector (SAE loss added to total loss).
#   - SAE loss = variance-normalized MSE + (1/32) * dead_feature_aux
#   - Loss weight 0.1 initially — tune up if reconstruction degrades
#
# Decoder normalization: Unit-norm columns, enforced after each optimizer step.
#   - Trainer calls model.sparse_ae.normalize_decoder_weights() post-step.
# =============================================================================
sparse_features:
  enabled: true
  per_branch: true

  # Dictionary size: 4x expansion is standard (Anthropic, OpenAI, DeepMind)
  # 1024 * 4 = 4096 features per branch
  dict_size: 4096

  # Target active features per sample per branch
  # 128 = ~3% of dict_size (4096) — good sparsity for interpretability
  target_k: 128

  # Features inactive for this many batches get auxiliary loss to revive them
  dead_feature_window: 5

  # Auxiliary loss coefficient (1/32 is standard from OpenAI TopK paper)
  aux_loss_coeff: 0.03125

  # LayerNorm CLIP features before SAE (recommended: CLIP features have
  # high variance across dimensions, LN makes SAE training more stable)
  normalize_inputs: true

  # Legacy config (kept for backward compat, overridden by above)
  sparse_autoencoder:
    input_dim:              1024
    expansion_factor:       4
    sparsity_penalty:       0.05
    l1_coefficient:         0.001
    target_active_features: 128
  discovered_features:
    save_interpretations: true
    top_k_features:       10

# -----------------------------------------------------------------------------
# Module 5: Multi-task Classifier
# -----------------------------------------------------------------------------
classifier:
  type:       multi_task
  input_dim:  1024       # matches fusion.projection_dim (classifier sees fused features)

  tasks:
    - name:        classification
      type:        binary
      output_dim:  2
      loss_weight: 1.0
    - name:        uncertainty
      type:        regression
      output_dim:  1
      loss_weight: 0.5
    - name:        violation_score
      type:        regression
      output_dim:  1
      loss_weight: 0.3

  hidden_dims: [512, 256]
  dropout:     0.4

# -----------------------------------------------------------------------------
# Loss function
# -----------------------------------------------------------------------------
loss_func:
  classification:         cross_entropy
  probabilistic_circuits: expected_calibration_error
  causal_consistency:     violation_penalty
  sparse_penalty:         l1_norm
  weights:
    classification: 1.0
    uncertainty:    0.5
    causal:         0.0     # 0 until causal module is enabled
    sparse:         0.2     # SAE loss weight — start conservative

# -----------------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------------
optimizer:
  type: adam
  adam:
    lr: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false
  module_lr:
    backbone_layernorms: 0.00001
    always_trainable:    0.0001
    phase_proj:          0.0003
    projection_heads:    0.0001
    fusion:              0.0002
    classifier:          0.0002
    # SAE gets standard LR (in optional_modules group)
    # Can increase to 0.0003 if SAE reconstruction is slow to converge

# -----------------------------------------------------------------------------
# Training schedule
# -----------------------------------------------------------------------------
lr_scheduler:   cosine_warmup
warmup_epochs:  2
nEpochs:        50
start_epoch:    0
save_epoch:     1
rec_iter:       100
logdir:         ./logs
manualSeed:     1024
save_ckpt:      true
save_feat:      true
grad_clip:      1.0
freq_grad_clip: 2.0

training_phases:
  phase1:
    epochs:        [0, 5]
    freeze_modules: [foundation_models]
    train_modules:  [fusion, classifier, sparse_ae]
    description:   "Warm up fusion + classifier + SAE with frozen backbones"
  phase2:
    epochs: [5, 10]
    freeze_modules: []
    train_modules:  [layernorms_and_heads]
    description: "Unfreeze backbone LayerNorms for GenD-style adaptation"
  phase3:
    epochs:        [10, 50]
    freeze_modules: []
    train_modules:  [all]
    enable_causal:  true
    description:   "Enable causal discovery (set causal_module.enabled=true)"

# -----------------------------------------------------------------------------
# Metrics & interpretability
# -----------------------------------------------------------------------------
metric_scoring:     auc
additional_metrics: [acc, eer, ap, uncertainty_calibration]

interpretability:
  save_attention_maps:      true
  save_causal_graphs:       true
  save_feature_activations: true
  save_sae_features:        true     # log top-activating images per SAE feature
  visualization_frequency:  500

# -----------------------------------------------------------------------------
# Hardware
# -----------------------------------------------------------------------------
cuda:            true
cudnn:           true
mixed_precision: true

checkpoint:
  save_best_only: false
  monitor:        val_auc
  mode:           max