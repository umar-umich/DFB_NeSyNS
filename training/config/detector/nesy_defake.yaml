# =============================================================================
# NeSyDeFake Hybrid Detector — Configuration (FRAME-LEVEL + SAE, Step 5b)
# =============================================================================
# Changelog (Step 5b — SAE integration):
#   - sparse_features.enabled: true (SAE now active)
#   - Added: dict_size, target_k, dead_feature_window, aux_loss_coeff, normalize_inputs
#   - SAE operates on raw CLIP features (pre-projection, 1024-d)
#   - SAE loss weight: 0.1 (tunable — start low so SAE doesn't dominate early)
#   - Added SAE to optimizer (optional_modules group, base LR)
# =============================================================================

log_dir: /data/umar/Repos/DFB_NeSyNS/logs_debug/nesydefake_hybrid

model_name: nesydefake_hybrid
backbone_name: multi_stream

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
dataset_type: nesydefake
active_branches: ['spatial', 'frequency']

train_dataset: [FaceForensics++]
test_dataset:  [FaceForensics++, Celeb-DF-v2]
all_dataset:   [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter,
                DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC,
                DeeperForensics-1.0, UADFV]

compression: c23

# -----------------------------------------------------------------------------
# Frame configuration
# -----------------------------------------------------------------------------
video_mode: false
frame_num:
  train: 32
  test:  32

resolution:    224
with_mask:     false
with_landmark: false

load_semantic_features: false   # Replaced by on-the-fly CLIP facial attributes

class_weights: [1.0, 1.0]

projection_dropout:
  spatial:   0.2
  frequency: 0.1

# -----------------------------------------------------------------------------
# Data loading & augmentation
# -----------------------------------------------------------------------------
train_batchSize: 256
test_batchSize:  256
workers:         8

use_data_augmentation: true
balance_classes:       true
balance_target_ratio: 0.35   # tune: 0.5=full balance, 0.35=soft, 0.25=mild

data_aug:
  flip_prob:        0.5   # keep — class-neutral
  rotate_prob:      0.3   # keep but reduce slightly
  rotate_limit:     [-10, 10]
  blur_prob:        0.1   # reduce from 0.5 — blur mimics fake compression artifacts
  blur_limit:       [3, 5]  # reduce max kernel
  brightness_prob:  0.5   # keep — class-neutral
  brightness_limit: [-0.1, 0.1]
  contrast_limit:   [-0.1, 0.1]
  quality_lower:    80    # raise floor significantly — low quality = fake artifact
  quality_upper:    100

mean: [0.5, 0.5, 0.5]
std:  [0.5, 0.5, 0.5]

# -----------------------------------------------------------------------------
# Foundation Models
# -----------------------------------------------------------------------------
foundation_models:

  spatial:
    name:            clip
    model_path:      openai/clip-vit-large-patch14
    output_dim:      1024
    freeze_backbone: true
    # Phase 1: train_layernorms=false → true hard freeze (backbone + LNs frozen).
    # The trainer calls unfreeze_layernorms() at phase2_start, which is when LNs
    # actually start training (GenD-style: LN-only adaptation for generalization).
    train_layernorms: false
    normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

  frequency:
    name:             fad_clip
    model_path:       openai/clip-vit-large-patch14
    output_dim:       1024
    freeze_backbone:  true
    # Phase 1: same hard freeze as spatial. The FAD front-end (DCT filters,
    # emphasis weights) is ALWAYS trainable regardless of this flag — it is
    # not part of the pretrained backbone and must adapt from epoch 0.
    train_layernorms: false
    fad_mode:         single
    fad_learnable:    true
    freq_emphasis_init: 0.1
    normalization:
      keep_raw:       true
    clip_normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

# Fusion
fusion:
  type:           attention 
  fused_dim:      2048
  projection_dim: 1024
  dropout:        0.3

# -----------------------------------------------------------------------------
# On-the-fly CLIP Facial Attributes (FaceLaVa/FaceBench-inspired)
# -----------------------------------------------------------------------------
semantic_attributes:
  enabled: true
  categories: all           # 'all' or list: [face_structure, eyes, skin, ...]
  temperature: 0.07         # CLIP cosine similarity temperature

# -----------------------------------------------------------------------------
# Module 3: Causal Discovery
# -----------------------------------------------------------------------------
causal_module:
  # End-to-end: causal module trains from epoch 0 with loss weight warm-up.
  # Gradients flow back through causal module to SAE and backbone.
  enabled: true

  # Causal warmup at epoch 0: pre-populates EMA buffers before main training.
  causal_warmup_batches: 100   # reduced: end-to-end training compensates

  # Z_sae: full dict vectors from both SAE branches
  #   dict_size=4096 per branch → z_sae is 8192-d sparse (target_k=128 active per branch)
  # The SparseFeatureSelector projects 8192 → total_sae_dim (dense) linearly.
  # S_semantic: 73 per-frame attributes
  latent_variables:
    z_spatial_dim:    128    # = target_k from sparse_features (active features per branch per sample)
    z_frequency_dim:  128
    total_sae_dim:    256    # compressed dense output of SparseFeatureSelector (8192 → 256)

  semantic_dim: 68           # auto-overridden by CLIPFacialAttributeExtractor if enabled

  discovery:
    algorithm:        dagma_dce
    max_parents:      3
    sparsity_penalty: 0.01

  dag_learning:
    hidden_dim:          128
    num_layers:          3
    learning_rate:       0.001
    dag_penalty_weight:  0.1

# -----------------------------------------------------------------------------
# Module 4: Sparse Monosemantic Features (SAE)
# =============================================================================
# Architecture: Per-branch BatchTopK SAE
#   - Spatial CLIP (1024) -> dict_size=4096, target_k=128 active features
#   - Frequency CLIP (1024) -> dict_size=4096, target_k=128 active features
#
# BatchTopK (Bussmann et al., 2024):
#   - Selects top (k * batch_size) activations across the batch
#   - Average ~128 active per sample, but adaptive per-sample
#   - No L1 coefficient tuning needed (direct sparsity control)
#
# Training: Joint with detector (SAE loss added to total loss).
#   - SAE loss = variance-normalized MSE + (1/32) * dead_feature_aux
#   - Loss weight 0.1 initially — tune up if reconstruction degrades
#
# Decoder normalization: Unit-norm columns, enforced after each optimizer step.
#   - Trainer calls model.sparse_ae.normalize_decoder_weights() post-step.
# =============================================================================
sparse_features:
  enabled: true   # SAE trains jointly from Phase 1; loss weight controlled by loss_func.weights.sparse
  per_branch: false

  # Dictionary size: 4x expansion is standard (Anthropic, OpenAI, DeepMind)
  # 1024 * 4 = 4096 features per branch
  dict_size: 4096

  # Target active features per sample per branch
  # 128 = ~3% of dict_size (4096) — good sparsity for interpretability
  target_k: 128

  # Features inactive for this many batches get auxiliary loss to revive them
  dead_feature_window: 200

  # Auxiliary loss coefficient (1/32 is standard from OpenAI TopK paper)
  aux_loss_coeff: 0.2 #0.03125

  # LayerNorm CLIP features before SAE (recommended: CLIP features have
  # high variance across dimensions, LN makes SAE training more stable)
  normalize_inputs: true

  # Legacy config (kept for backward compat, overridden by above)
  sparse_autoencoder:
    input_dim:              1024
    expansion_factor:       4
    sparsity_penalty:       0.05
    l1_coefficient:         0.001
    target_active_features: 128
  discovered_features:
    save_interpretations: true
    top_k_features:       10

# -----------------------------------------------------------------------------
# Module 5: Multi-task Classifier
# -----------------------------------------------------------------------------
classifier:
  type:       multi_task
  input_dim:  1024       # matches fusion.projection_dim (classifier sees fused features)

  tasks:
    - name:        classification
      type:        binary
      output_dim:  2
      loss_weight: 1.0
    - name:        uncertainty
      type:        regression
      output_dim:  1
      loss_weight: 0.5
    - name:        violation_score
      type:        regression
      output_dim:  1
      loss_weight: 0.3

  hidden_dims: [512, 256]
  dropout:     0.4

# -----------------------------------------------------------------------------
# Loss function
# -----------------------------------------------------------------------------
loss_func:
  classification:         cross_entropy
  probabilistic_circuits: expected_calibration_error
  causal_consistency:     violation_penalty
  sparse_penalty:         l1_norm
  weights:
    classification: 1.0
    uncertainty:    0.5
    causal:         0.01    # start small, ramped up by loss_warmup schedule
    sparse:         0.01    # start small, ramped up by loss_warmup schedule
    contrastive:    0.01    # start small, ramped up by loss_warmup schedule

# Loss weight warm-up: linear ramp so all modules learn jointly from epoch 0
# without any single loss dominating early training.
loss_warmup:
  causal:
    start_epoch: 0
    end_epoch: 10
    start_weight: 0.01
    end_weight: 0.3
  contrastive:
    start_epoch: 0
    end_epoch: 10
    start_weight: 0.01
    end_weight: 0.3
  causal_fake:
    start_epoch: 0
    end_epoch: 10
    start_weight: 0.005
    end_weight: 0.15
  contrastive_fake:
    start_epoch: 0
    end_epoch: 10
    start_weight: 0.005
    end_weight: 0.15
  sparse:
    start_epoch: 0
    end_epoch: 5
    start_weight: 0.01
    end_weight: 0.1

# -----------------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------------
optimizer:
  type: adam
  adam:
    lr: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false
  module_lr:
    backbone_layernorms: 0.00001
    always_trainable:    0.0001
    phase_proj:          0.0003
    projection_heads:    0.0001
    fusion:              0.0002
    classifier:          0.0002
    # SAE gets standard LR (in optional_modules group)
    # Can increase to 0.0003 if SAE reconstruction is slow to converge

# -----------------------------------------------------------------------------
# Training schedule
# -----------------------------------------------------------------------------
lr_scheduler:   cosine_warmup
warmup_epochs:  2
nEpochs:        50
start_epoch:    0
save_epoch:     1
rec_iter:       100
logdir:         ./logs
manualSeed:     1024
save_ckpt:      true
save_feat:      true
grad_clip:      1.0
freq_grad_clip: 2.0

training_phases:
  # ─────────────────────────────────────────────────────────────────────────
  # Phase 1 — Warm-up with hard-frozen backbone (short)
  #   All modules train jointly from epoch 0 (including causal + SAE).
  #   Backbone frozen (incl LayerNorms) so projections/fusion/causal/SAE
  #   stabilize on static pretrained features first.
  #   Loss warm-up: causal/contrastive/sparse weights ramp from 0.01.
  # ─────────────────────────────────────────────────────────────────────────
  phase1:
    epochs:         [0, 5]
    freeze_modules: [foundation_models]
    train_modules:  [fad_frontend, projection_heads, fusion, classifier, sparse_ae, causal_module, clip_attributes]
    description:    "Hard freeze backbone. All other modules train jointly. Loss warmup active."

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 2 — Full end-to-end with GenD-style LN adaptation
  #   Unfreeze backbone LayerNorms. All modules continue joint training.
  #   Loss weights reach full values by epoch 10.
  # ─────────────────────────────────────────────────────────────────────────
  phase2:
    epochs:         [5, 50]
    freeze_modules: []
    train_modules:  [all]
    description:    "Unfreeze backbone LNs. Full end-to-end training. Loss warmup completes by epoch 10."

# -----------------------------------------------------------------------------
# Metrics & interpretability
# -----------------------------------------------------------------------------
metric_scoring:     auc
additional_metrics: [acc, eer, ap, uncertainty_calibration]

interpretability:
  save_attention_maps:      true
  save_causal_graphs:       true
  save_feature_activations: true
  save_sae_features:        true     # log top-activating images per SAE feature
  visualization_frequency:  500

# -----------------------------------------------------------------------------
# Hardware
# -----------------------------------------------------------------------------
cuda:            true
cudnn:           true
mixed_precision: true

checkpoint:
  save_best_only: false         # Save periodic checkpoints for analysis
  save_interval: 5              # Save every 5 epochs
  monitor:        val_auc
  mode:           max

# Early stopping: stop if no improvement for patience epochs
early_stopping:
  enabled: true
  patience: 15                  # epochs without avg AUC improvement
  min_delta: 0.001              # minimum improvement to reset patience