# =============================================================================
# NeSyDeFake Hybrid Detector — Configuration (v4 — cleaned up)
# =============================================================================
# v4 changes:
#   - Removed dead modules: ViolationScorer, ConceptPredictionHead,
#     contrastive loss, graph divergence, uncertainty head
#   - Causal gate init raised: -3.0 → 0.0 (sigmoid=0.5)
#   - SAE dict_size: 4096 → 1024 (fix 95% dead features)
#   - Classifier simplified to classification-only
#   - Loss landscape: classification + causal_structural + sparse + UA + causal_semantic
# =============================================================================

log_dir: /data/umar/Repos/DFB_NeSyNS/logs_debug/nesydefake_hybrid

model_name: nesydefake_hybrid
backbone_name: multi_stream

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
dataset_type: nesydefake
active_branches: ['spatial', 'frequency']

train_dataset: [FaceForensics++_augmented]
test_dataset:  [FaceForensics++, Celeb-DF-v2]
all_dataset:   [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter,
                DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC,
                DeeperForensics-1.0, UADFV]

compression: c23

# -----------------------------------------------------------------------------
# Frame configuration
# -----------------------------------------------------------------------------
video_mode: false
frame_num:
  train: 32
  test:  32

resolution:    224
with_mask:     false
with_landmark: false

load_semantic_features: false

class_weights: [1.0, 1.0]

projection_dropout:
  spatial:   0.2
  frequency: 0.1

# -----------------------------------------------------------------------------
# Data loading & augmentation
# -----------------------------------------------------------------------------
train_batchSize: 128
test_batchSize:  128
workers:         8

use_data_augmentation: true
balance_classes:       true
balance_target_ratio: 0.5

# Source-paired training (GenD, WACV 2026)
paired_training: true

data_aug:
  flip_prob:        0.5
  rotate_prob:      0.3
  rotate_limit:     [-10, 10]
  blur_prob:        0.1
  blur_limit:       [3, 5]
  brightness_prob:  0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit:   [-0.1, 0.1]
  quality_lower:    80
  quality_upper:    100

mean: [0.5, 0.5, 0.5]
std:  [0.5, 0.5, 0.5]

# -----------------------------------------------------------------------------
# Foundation Models
# -----------------------------------------------------------------------------
foundation_models:

  spatial:
    name:            clip
    model_path:      openai/clip-vit-large-patch14
    output_dim:      1024
    freeze_backbone: true
    train_layernorms: false
    normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

  frequency:
    name:             fad_clip
    model_path:       openai/clip-vit-large-patch14
    output_dim:       1024
    freeze_backbone:  true
    train_layernorms: false
    fad_mode:         single
    fad_learnable:    true
    freq_emphasis_init: 0.1
    normalization:
      keep_raw:       true
    clip_normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

# Fusion
fusion:
  type:           attention
  fused_dim:      2048
  projection_dim: 1024
  dropout:        0.3

# -----------------------------------------------------------------------------
# Uniformity-Alignment Loss (Wang & Isola, 2020 / GenD, WACV 2026)
# -----------------------------------------------------------------------------
uniformity_alignment:
  enabled: true
  alignment_weight: 0.1
  uniformity_weight: 0.5
  l2_normalize: true

# -----------------------------------------------------------------------------
# Semantic Feature Gate (generalization)
# -----------------------------------------------------------------------------
semantic_gate:
  enabled: true

# -----------------------------------------------------------------------------
# Facial Semantic Attributes (precomputed Face-LLaVA)
# -----------------------------------------------------------------------------
semantic_attributes:
  enabled: true
  backend: precomputed
  precomputed_dim: 211
  precomputed_dir: facellava_semantic
  output_dim: 211
  model_path: /data/umar/Repos/FaceBench
  use_llm: true
  fp16: true
  micro_batch_size: 16

# -----------------------------------------------------------------------------
# Tier 1: Cross-Attribute Consistency Rules (forensic)
# -----------------------------------------------------------------------------
# Differentiable violation scores computed from 211 FaceBench attributes.
# Captures gender-attribute, expression-AU, and mutually-exclusive conflicts.
consistency_rules:
  enabled: true
  output_dim: 18

# -----------------------------------------------------------------------------
# Tier 2: Pixel-Level Forensic Features (precomputed)
# -----------------------------------------------------------------------------
# Boundary gradients, regional blur, L/R symmetry, color consistency,
# frequency anomaly, quality metrics — extracted via SegFormer face parsing.
forensic_features:
  enabled: true           # Enable after running precompute_forensic_features.py
  output_dim: 30
  precomputed_dir: forensic_features

# -----------------------------------------------------------------------------
# Tier 3: Causal Intervention Module (inference only)
# -----------------------------------------------------------------------------
# Do-calculus interventions on learned causal graphs at test time.
# Flips top-k attributes and measures SCM response discrepancy.
causal_intervention:
  enabled: true
  output_dim: 16
  top_k_interventions: 10

# -----------------------------------------------------------------------------
# Causal Attention Fusion
# -----------------------------------------------------------------------------
# The fused CLIP features (query) attend over the 4 causal residuals
# (keys/values), dynamically selecting which are most informative.
causal_attention:
  attn_dim: 256

# -----------------------------------------------------------------------------
# Module 3: Causal Discovery
# -----------------------------------------------------------------------------
causal_module:
  enabled: true
  causal_warmup_batches: -1          # -1 = use all training batches

  latent_variables:
    z_spatial_dim:    128
    z_frequency_dim:  128

  semantic_dim: 211

  discovery:
    algorithm:              dagma_dce
    max_parents:            3
    sparsity_penalty:       0.01
    jacobian_every_n:       4
    enforce_directionality: true    # Part B: block latent→semantic edges

  # Part A: Intra-semantic causal graph (211-node SCM pair)
  semantic_graph:
    enabled:    true
    hidden_dim: 64
    num_layers: 2

  dag_learning:
    hidden_dim:          128
    num_layers:          3
    learning_rate:       0.001
    dag_penalty_weight:  0.1

# -----------------------------------------------------------------------------
# Module 4: Sparse Monosemantic Features (SAE)
# -----------------------------------------------------------------------------
# v4: Reduced dict_size 4096→1024 to fix 95% dead features.
# With 1024 features and target_k=128, ~12.5% are active per sample,
# making it much harder for features to die.
sparse_features:
  enabled: false
  per_branch: false
  dict_size: 1024              # was 4096 — 95% dead features
  target_k: 128
  dead_feature_window: 200
  aux_loss_coeff: 0.2
  normalize_inputs: true

  # Legacy config (kept for backward compat)
  sparse_autoencoder:
    input_dim:              1024
    expansion_factor:       1       # updated to match dict_size=1024
    sparsity_penalty:       0.05
    l1_coefficient:         0.001
    target_active_features: 128
  discovered_features:
    save_interpretations: true
    top_k_features:       10

# -----------------------------------------------------------------------------
# Module 5: Classifier (classification only)
# -----------------------------------------------------------------------------
classifier:
  type:       multi_task
  input_dim:  1024

  tasks:
    - name:        classification
      type:        binary
      output_dim:  2
      loss_weight: 1.0

  hidden_dims: [512, 256]
  dropout:     0.3              # reduced from 0.4

# -----------------------------------------------------------------------------
# Loss function (v4: cleaned up — only active losses)
# -----------------------------------------------------------------------------
loss_func:
  classification:         cross_entropy
  sparse_penalty:         l1_norm
  weights:
    classification:     1.0
    causal:             0.01
    sparse:             0.01
    causal_semantic:    0.01

# Loss weight warm-up
loss_warmup:
  causal:
    start_epoch: 0
    end_epoch: 10
    start_weight: 0.01
    end_weight: 0.2
  causal_fake:
    start_epoch: 0
    end_epoch: 10
    start_weight: 0.005
    end_weight: 0.1
  sparse:
    start_epoch: 0
    end_epoch: 10
    start_weight: 0.01
    end_weight: 0.1
  causal_semantic:
    start_epoch: 0
    end_epoch: 10
    start_weight: 0.01
    end_weight: 0.1

# -----------------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------------
optimizer:
  type: adam
  adam:
    lr: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0001
    amsgrad: false
  module_lr:
    backbone_layernorms: 0.0001
    always_trainable:    0.0001
    phase_proj:          0.0003
    projection_heads:    0.0001
    fusion:              0.0002
    classifier:          0.0002

# -----------------------------------------------------------------------------
# Training schedule
# -----------------------------------------------------------------------------
lr_scheduler:   cosine_warmup
warmup_epochs:  2
nEpochs:        100
start_epoch:    0
save_epoch:     1
rec_iter:       100
logdir:         ./logs
manualSeed:     1024
save_ckpt:      true
save_feat:      true
grad_clip:      1.0
freq_grad_clip: 2.0

training_phases:
  phase1:
    epochs:         [0, 5]
    freeze_modules: [foundation_models]
    train_modules:  [fad_frontend, projection_heads, fusion, classifier, sparse_ae, causal_module, semantic_extractor]
    description:    "Hard freeze backbone. All modules train jointly. Loss warmup active."

  phase2:
    epochs:         [5, 50]
    freeze_modules: []
    train_modules:  [all]
    description:    "Unfreeze backbone LNs at epoch 5. Causal module active from epoch 0."

# -----------------------------------------------------------------------------
# Metrics & interpretability
# -----------------------------------------------------------------------------
metric_scoring:     auc
additional_metrics: [acc, eer, ap]

interpretability:
  save_attention_maps:      true
  save_causal_graphs:       true
  save_feature_activations: true
  save_sae_features:        true
  visualization_frequency:  500
  graph_viz_top_k:          20
  graph_viz_every_n_epochs: 5

# -----------------------------------------------------------------------------
# Hardware
# -----------------------------------------------------------------------------
cuda:            true
cudnn:           true
mixed_precision: true

checkpoint:
  save_best_only: false
  save_interval: 5
  monitor:        val_auc
  mode:           max

early_stopping:
  enabled: true
  patience: 20
  min_delta: 0.001
