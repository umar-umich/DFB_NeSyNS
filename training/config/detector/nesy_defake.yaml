# =============================================================================
# NeSyDeFake Hybrid Detector — Configuration
# =============================================================================
# Changelog (Step 2 cleanup):
#   - Removed: clip_size=8 (was for old sub-clip splitting, now 32 = segment_size)
#   - Removed: num_clips_per_video (meaningless after full-segment dataset rewrite)
#   - Removed: sampling block (sliding_window / overlap logic no longer used)
#   - Fixed:   sparse_features.input_dim 256→1024 to match projection_dim
#   - Added:   balance_classes toggle (WeightedRandomSampler from Step 1)
#   - Added:   video_mode: true explicitly at top level
#   - Cleaned: temporal/spatial foundation_model comment blocks (options as 1-liners)
#   - Note:    fused_dim below is a documentation hint only — build_backbone()
#              patches it at runtime from active_branches × branch output_dims
# =============================================================================

log_dir: /data/umar/Repos/DFB_NeSyNS/logs_debug/nesydefake_hybrid

model_name: nesydefake_hybrid
backbone_name: multi_stream

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
dataset_type: nesydefake

# Ablation control — override at CLI with: --active_branches temporal spatial
# All foundation model configs below must stay even when a branch is inactive,
# because ablation runs re-enable them without touching this file.
active_branches: ['temporal']   # options: temporal | spatial | frequency

train_dataset: [FaceForensics++]
test_dataset:  [FaceForensics++, Celeb-DF-v2]
all_dataset:   [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter,
                DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC,
                DeeperForensics-1.0, UADFV]

compression: c23

# -----------------------------------------------------------------------------
# Video / frame configuration
# -----------------------------------------------------------------------------
video_mode: true          # always true — we operate on full video segments
frame_num:
  train: 32               # full 32-frame segment per video (DeepfakeBench standard)
  test:  32

# clip_size must equal frame_num so the base class delivers one entry per video
# with all frames — no internal sub-clip splitting.
clip_size: 32

resolution:    224
with_mask:     false
with_landmark: false

# -----------------------------------------------------------------------------
# Data loading & augmentation
# -----------------------------------------------------------------------------
train_batchSize: 32   # reduced from 128 — each sample is now (32, 3, 224, 224)×3 branches
test_batchSize:  32
workers:         8

use_data_augmentation: false   # set true to enable online augmentation
balance_classes:       false   # set true to enable WeightedRandomSampler

data_aug:
  flip_prob:        0.5
  rotate_prob:      0.5
  rotate_limit:     [-10, 10]
  blur_prob:        0.5
  blur_limit:       [3, 7]
  brightness_prob:  0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit:   [-0.1, 0.1]
  quality_lower:    40
  quality_upper:    100

# Global normalization fallback (per-branch norms are set in foundation_models)
mean: [0.5, 0.5, 0.5]
std:  [0.5, 0.5, 0.5]

# -----------------------------------------------------------------------------
# Foundation Models (all three must remain defined for ablation compatibility)
# -----------------------------------------------------------------------------
# Input to all branches: (B, T=32, C=3, H=224, W=224)
# Each branch applies its own learnable Linear(raw_dim → projection_dim)
# before fusion. The detector handles this — the dataset just delivers tensors.
#
# Commented options (one-liners for reference):
#   temporal:  videomae (768) | perception_encoder (1792) | vjepa2-vitl (1024) ✓
#   spatial:   dinov2-large (1024) | dinov2-giant (1536) | eva_clip (768) | gend (1024) ✓
#   frequency: spsl/xception (512) ✓ | srm_resnet (512)

foundation_models:

  temporal:
    name:            vjepa2
    model_path:      facebook/vjepa2-vitl-fpc64-256
    output_dim:      1024
    freeze_backbone: true
    normalization:
      mean: [0.485, 0.456, 0.406]
      std:  [0.229, 0.224, 0.225]

  spatial:
    name:            clip                             # raw backbone, GenD-style
    model_path:      openai/clip-vit-large-patch14    # raw CLIP, NOT a GenD ckpt
    output_dim:      1024                             # matches CLIP-L hidden size
    freeze_backbone: true                             # always true
    train_layernorms: true                            # KEY: GenD regime — only LNs train
    normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

  frequency:
    name:            spsl
    output_dim:      512
    freeze_backbone: true
    pretrained:      ./training/pretrained/xception-b5690688.pth
    backbone_name:   xception
    backbone_config:
      mode:        original
      num_classes: 2
      inc:         4
      dropout:     false
    loss_func:       cross_entropy
    normalization:
      mean: [0.5, 0.5, 0.5]
      std:  [0.5, 0.5, 0.5]

# -----------------------------------------------------------------------------
# Fusion
# -----------------------------------------------------------------------------
# fused_dim below is a DOCUMENTATION HINT only.
# build_backbone() always patches it at runtime:
#   fused_dim = sum(branch output_dims for active branches)
# Current active example: temporal only → fused_dim = 1024 (patched at runtime)
# All branches active:                  → fused_dim = 1024+1024+512 = 2560
fusion:
  type:           concat
  fused_dim:      2560    # patched at runtime by build_backbone() — do not rely on this value
  projection_dim: 1024    # all branch projections map to this dim before fusion
  dropout:        0.3

# -----------------------------------------------------------------------------
# Module 2: Semantic Grounding
# -----------------------------------------------------------------------------
semantic_grounding:
  enabled: false
  detector_backend:   retinaface
  extract_age:        true
  extract_gender:     true
  extract_emotion:    true
  extract_race:       false
  fuse_with_features: true
  batch_process:      true
  enforce_detection:  false

# -----------------------------------------------------------------------------
# Module 3: Causal Discovery
# NOTE: training_phases.phase3 enables this — set enabled=true there
#       or toggle here when ready to run causal experiments.
# OPEN QUESTION (to resolve before enabling):
#   Causal discovery operates on fused video-level features (post-fusion),
#   not per-frame. This is the correct level — deepfake causality violations
#   (lighting, temporal coherence) are video-level phenomena, not frame-level.
# -----------------------------------------------------------------------------
causal_module:
  enabled: false

  latent_variables:
    z_spatial_dim:    64
    z_temporal_dim:   64
    z_frequency_dim:  32
    total_latent_dim: 160   # 64 + 64 + 32

  semantic_concepts:
    concepts: ['emotion', 'expression_intensity', 'lighting_consistency',
               'temporal_coherence', 'boundary_sharpness', 'color_consistency',
               'texture_authenticity']
    concept_dim: 7

  discovery:
    algorithm:       structural_causal_circuits
    max_parents:     3
    sparsity_penalty: 0.01

  reasoning:
    intervention_queries:      true
    counterfactual_detection:  true
    consistency_loss_weight:   1.0

  dag_learning:
    hidden_dim:          128
    num_layers:          3
    learning_rate:       0.001
    dag_penalty_weight:  0.1

# -----------------------------------------------------------------------------
# Module 4: Sparse Monosemantic Features
# -----------------------------------------------------------------------------
sparse_features:
  enabled: false
  sparse_autoencoder:
    input_dim:              1024   # must match fusion.projection_dim (was wrong: 256)
    expansion_factor:       4
    sparsity_penalty:       0.05
    l1_coefficient:         0.001
    target_active_features: 50
  discovered_features:
    save_interpretations: true
    top_k_features:       10

# -----------------------------------------------------------------------------
# Module 5: Multi-task Classifier
# -----------------------------------------------------------------------------
classifier:
  type:       multi_task
  input_dim:  1024   # matches fusion.projection_dim

  tasks:
    - name:        classification
      type:        binary
      output_dim:  2
      loss_weight: 1.0
    - name:        uncertainty
      type:        regression
      output_dim:  1
      loss_weight: 0.5
    - name:        violation_score
      type:        regression
      output_dim:  1
      loss_weight: 0.3

  hidden_dims: [512, 256]
  dropout:     0.4

# -----------------------------------------------------------------------------
# Loss function
# -----------------------------------------------------------------------------
loss_func:
  classification:         cross_entropy
  probabilistic_circuits: expected_calibration_error
  causal_consistency:     violation_penalty
  sparse_penalty:         l1_norm
  weights:
    classification: 1.0
    uncertainty:    0.5
    causal:         0.3
    sparse:         0.1

# -----------------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------------
optimizer:
  type: adam
  adam:
    lr: 0.0001           # base LR (used as fallback only)
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false
  module_lr:
    backbone_layernorms: 0.00001   # very low — LNs should adapt slowly
    projection_heads:    0.0001    # spatial_proj, temporal_proj, freq_proj
    fusion:              0.0002
    classifier:          0.0002
# -----------------------------------------------------------------------------
# Training schedule
# -----------------------------------------------------------------------------
lr_scheduler:   cosine_warmup
warmup_epochs:  2
nEpochs:        10
start_epoch:    0
save_epoch:     1
rec_iter:       100
logdir:         ./logs
manualSeed:     1024
save_ckpt:      true
save_feat:      true
grad_clip:      1.0

# Training phases — progressive unfreezing strategy.
# phase3 enables causal discovery; set causal_module.enabled=true when ready.
training_phases:
  phase1:
    epochs:        [0, 5]
    freeze_modules: [foundation_models]
    train_modules:  [fusion, classifier]
    description:   "Warm up fusion and classifier with frozen backbones"
  phase2:
    epochs:        [5, 10]
    freeze_modules: []
    train_modules:  [all]
    description:   "Fine-tune all active modules"
  phase3:
    epochs:        [10, 50]
    freeze_modules: []
    train_modules:  [all]
    enable_causal:  true
    description:   "Enable causal discovery — set causal_module.enabled=true"

# -----------------------------------------------------------------------------
# Metrics & interpretability
# -----------------------------------------------------------------------------
metric_scoring:     auc
additional_metrics: [acc, eer, ap, uncertainty_calibration]

interpretability:
  save_attention_maps:      true
  save_causal_graphs:       true
  save_feature_activations: true
  visualization_frequency:  500

# -----------------------------------------------------------------------------
# Hardware
# -----------------------------------------------------------------------------
cuda:            true
cudnn:           true
mixed_precision: true

checkpoint:
  save_best_only: false
  monitor:        val_auc
  mode:           max