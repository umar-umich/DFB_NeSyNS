# log dir 
log_dir: /data/Umar/Repos/DFB_NeSyNS/logs_debug/nesydefake_hybrid
  
model_name: nesydefake_hybrid
backbone_name: multi_stream  # multi-stream backbone

# Dataset configuration
dataset_type: nesydefake  # Use custom dataset class

active_branches: ['temporal']#, 'spatial', 'frequency']

# Module 1: Foundation Model Features
foundation_models:

  temporal:
  # ── Option A: VideoMAE ──────────────────────────────────────────
  # Classic masked-autoencoder pre-training on Kinetics.
  # Best for: appearance-based recognition, well-studied baseline.
  # Expected frames: 16
 
  #   name: videomae
  #   model_path: MCG-NJU/videomae-base-finetuned-kinetics  # videomae-base-finetuned-kinetics
  #   output_dim: 768
  #   freeze_backbone: true  # Set to true for faster training initially
  #   normalization:
  #     mean: [0.485, 0.456, 0.406]
  #     std: [0.229, 0.224, 0.225]

  # model_name: videomae
  # model_path: MCG-NJU/videomae-base-finetuned-kinetics
  # output_dim: 768       # base: 768 | large: 1024
  # freeze_backbone: true
  # normalization:
  #   mean: [0.485, 0.456, 0.406]   # ImageNet mean (standard for VideoMAE)
  #   std:  [0.229, 0.224, 0.225]

  # ── Option B: Perception Encoder (PE Video) ─────────────────────
  # Meta's Perception Encoder, trained on massive audio-visual data.
  # Best for: rich spatial-semantic video understanding.
  # Expected frames: 8  (flexible, 8–16 recommended)
  #
  # model_name: perception_encoder
  # model_path: facebook/pe-av-large
  # output_dim: 1792
  # freeze_backbone: true
  # normalization:
  #   # PE uses the same ImageNet stats as its ViT vision backbone
  #   mean: [0.485, 0.456, 0.406]
  #   std:  [0.229, 0.224, 0.225]

  # ── Option C: V-JEPA 2 (RECOMMENDED) ───────────────────────────
  # FAIR/Meta world model, pre-trained on >1M hours of video.
  # SOTA on motion understanding and action anticipation.
  # 3D-RoPE gives precise spatiotemporal position encoding —
  # ideal for detecting unnatural facial motion in deepfakes.
  # Expected frames: 8
  #
  # Checkpoint options:
  #   facebook/vjepa2-vitl-fpc64-256  → output_dim: 1024  (VRAM-friendly)
  #   facebook/vjepa2-vith-fpc64-256  → output_dim: 1280
  #   facebook/vjepa2-vitg-fpc64-256  → output_dim: 1408  (strongest)
  #   facebook/vjepa2-vitg-fpc64-384  → output_dim: 1408  (highest resolution)

    name: vjepa2                          # or videomae / perception_encoder
    model_path: facebook/vjepa2-vitl-fpc64-256  # ViT-L: output_dim 1024
    output_dim: 1024
    freeze_backbone: true
    normalization:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

    
  spatial:
  # OPTION 1: DINOv2-Large (RECOMMENDED - Best for deepfakes)
  #   name: dinov2
  #   model_path: facebook/dinov2-large
  #   output_dim: 1024
  #   freeze_backbone: true  # Fine-tune for best performance
  #   use_image_encoder: true
  #   normalization:
  #     mean: [0.485, 0.456, 0.406]  # ImageNet for DINOv2
  #     std: [0.229, 0.224, 0.225]
  
  # OPTION 2: DINOv2-Giant (Most powerful, if you have 48GB GPUs)
  #   name: dinov2
  #   model_path: facebook/dinov2-giant
  #   output_dim: 1536
  #   freeze_backbone: true
  #   use_image_encoder: true
  #   normalization:
  #     mean: [0.485, 0.456, 0.406]  # ImageNet for DINOv2
  #     std: [0.229, 0.224, 0.225]

    # name: eva_clip
    # model_path: EVA02-CLIP-L-14-336   # EVA02-CLIP-E-14-plus
    # output_dim: 768
    # freeze_backbone: true
    # use_image_encoder: true     

    name: gend
    model_path: yermandy/GenD_PE_L   # or a local path
    output_dim: 1024
    freeze_backbone: true
    normalization:
      mean: [0.481, 0.458, 0.408]  # CLIP
      std: [0.269, 0.261, 0.276]

  # OPTION 4: CLIP-Large-336 (Good balance)
  #   name: clip
  #   model_path: openai/clip-vit-large-patch14-336
  #   output_dim: 1024
  #   freeze_backbone: true
  #   use_image_encoder: true

  frequency:
    name:            spsl          # selects _build_spsl() / _forward_spsl()
    output_dim:      512           # projection target (2048 → 768 via Linear+LN+GELU)
    freeze_backbone: true          # freeze Xception weights after loading
    pretrained:      ./training/pretrained/xception-b5690688.pth
    backbone_name:   xception
    backbone_config:
      mode:        original        # use full Xception, not shallow variant
      num_classes: 2               # real / fake
      inc:         4               # conv1 built as 4-ch; pretrained RGB weights are averaged in
      dropout:     false
    loss_func:     cross_entropy   # required by SpslDetector.build_loss(); not used for inference

    # name: srm_resnet
    # srm_filters: 30  # Number of SRM filters
    # resnet_depth: 18  # ResNet-18 for frequency domain
    # output_dim: 512
    # freeze_srm: true  # Keep SRM filters fixed
    normalization:
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]    

  
# Fusion configuration
fusion:
  type: concat  # 'concat', 'attention', or 'weighted'
  fused_dim: 2048  # 768 + 768 + 512
  projection_dim: 1024  # Project to this dimension after fusion
  dropout: 0.3

# Module 2: Semantic Grounding (Expert Grounding - Explicit)
semantic_grounding:
  enabled: false  # Enable DeepFace-based semantic extraction
  
  # DeepFace configuration
  detector_backend: retinaface  # Options: 'opencv', 'ssd', 'mtcnn', 'retinaface', 'mediapipe'
  
  # Which semantic attributes to extract
  extract_age: true      # Age estimation (0-100, normalized)
  extract_gender: true   # Gender classification (Man/Woman probabilities)
  extract_emotion: true  # Emotion recognition (7 emotions: angry, disgust, fear, happy, sad, surprise, neutral)
  extract_race: false    # Race classification (optional, may be controversial)
  
  # Feature fusion
  fuse_with_features: true  # Combine explicit concepts with implicit features
  
  # Batch processing
  batch_process: true  # Process multiple faces at once
  enforce_detection: false  # If true, fail if no face detected; if false, use default values

# Module 3: Causal Discovery + Reasoning
causal_module:
  enabled: false
  
  # Feature preparation
  latent_variables:
    z_spatial_dim: 64
    z_temporal_dim: 64
    z_frequency_dim: 32
    total_latent_dim: 160  # 64 + 64 + 32
    
  semantic_concepts:
    # Explicit semantic variables to discover
    concepts: ['emotion', 'expression_intensity', 'lighting_consistency', 
               'temporal_coherence', 'boundary_sharpness', 'color_consistency', 
               'texture_authenticity']
    concept_dim: 7
    
  # Causal discovery algorithm
  discovery:
    algorithm: structural_causal_circuits  # Options: 'pc', 'notears', 'structural_causal_circuits', 'hybrid'
    max_parents: 3  # Maximum parents per node in DAG
    sparsity_penalty: 0.01
    
  # Causal reasoning
  reasoning:
    intervention_queries: true  # Enable P(Y | do(X=x))
    counterfactual_detection: true
    consistency_loss_weight: 1.0
    
  # DAG learning parameters
  dag_learning:
    hidden_dim: 128
    num_layers: 3
    learning_rate: 0.001
    dag_penalty_weight: 0.1  # Acyclicity constraint weight
    
# Module 4: Sparse Monosemantic Features (Optional, can be disabled)
sparse_features:
  enabled: false
  sparse_autoencoder:
    input_dim: 256  # From projection
    expansion_factor: 4  # Expand to 4096 dimensions
    sparsity_penalty: 0.05
    l1_coefficient: 0.001
    target_active_features: 50  # Only ~50 features active
    
  discovered_features:
    # These will be learned during training
    save_interpretations: true
    top_k_features: 10  # Track top-10 most important features

# Module 5: Final Classifier (Multi-task)
classifier:
  type: multi_task
  input_dim: 1024  # From fusion or sparse features
  
  tasks:
    - name: classification
      type: binary
      output_dim: 2
      loss_weight: 1.0
      
    - name: uncertainty
      type: regression
      output_dim: 1  # Entropy-based uncertainty
      loss_weight: 0.5
      
    - name: violation_score
      type: regression
      output_dim: 1  # Causal violation score
      loss_weight: 0.3
      
  hidden_dims: [512, 256]
  dropout: 0.4

# Combined loss function
loss_func:
  classification: cross_entropy
  probabilistic_circuits: expected_calibration_error  # For Module 2 (if enabled)
  causal_consistency: violation_penalty
  sparse_penalty: l1_norm
  
  weights:
    classification: 1.0
    uncertainty: 0.5
    causal: 0.3
    sparse: 0.1

# dataset
all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FaceForensics++]
test_dataset: [FaceForensics++, Celeb-DF-v2]

compression: c23
train_batchSize: 32  # Reduced due to larger model
test_batchSize: 32
workers: 16

# ===== NEW: Multi-stream sampling configuration =====
# Total frames per video
frame_num: 
  train: 32  # Extract 64 frames per video
  test: 32

# Clip configuration for temporal stream
clip_size: 8  # Each clip has 16 frames
num_clips_per_video: 32  # Sample 32 clips from 64 frames

# Sampling strategy
sampling:
  # Strategy: 'sliding_window', 'uniform', or 'random'
  # - sliding_window: Maximum coverage with overlap (recommended for training)
  # - uniform: Evenly spaced clips (good for testing)
  # - random: Random sampling (data augmentation)
  sampling_strategy: sliding_window
  
  # Overlap ratio for sliding window (0.0 = no overlap, 0.5 = 50% overlap)
  overlap_ratio: 0.5  # With clip_size=16, stride=8
  
  # Which frame to use from each clip for spatial/frequency features
  # Options: 'middle', 'first', 'last', 'random'
  spatial_frame_selection: middle  # Use middle frame of each clip

resolution: 224
with_mask: false
with_landmark: false
video_mode: true

# data augmentation
use_data_augmentation: false
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100

# mean and std for normalization
mean: [0.5, 0.5, 0.5]
std: [0.5, 0.5, 0.5]

# optimizer config
optimizer:
  type: adam
  adam:
    lr: 0.0001  # Lower learning rate for stability
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false
  
  # Separate learning rates for different modules
  module_lr:
    foundation_models: 0.00005  # Lower for pretrained models
    causal_module: 0.0001
    fusion: 0.0002
    classifier: 0.0002

# training config
lr_scheduler: cosine_warmup  # Warmup + cosine decay
warmup_epochs: 2
nEpochs: 50
start_epoch: 0
save_epoch: 1
rec_iter: 100
logdir: ./logs
manualSeed: 1024
save_ckpt: true
save_feat: true

# Gradient clipping for stability
grad_clip: 1.0

# Training phases (progressive training strategy)
training_phases:
  phase1:
    epochs: [0, 5]
    freeze_modules: ['foundation_models']
    train_modules: ['fusion', 'classifier']
    description: "Warm up fusion and classifier"
    
  phase2:
    epochs: [5, 10]
    freeze_modules: []
    train_modules: ['all']
    description: "Fine-tune all modules"
    
  phase3:
    epochs: [10, 50]
    freeze_modules: []
    train_modules: ['all']
    enable_causal: true
    description: "Enable causal discovery and reasoning"

# metric
metric_scoring: auc
additional_metrics: ['acc', 'eer', 'ap', 'uncertainty_calibration']

# Interpretability
interpretability:
  save_attention_maps: true
  save_causal_graphs: true
  save_feature_activations: true
  visualization_frequency: 500  # Every N iterations

# cuda
cuda: true
cudnn: true
mixed_precision: true  # Use automatic mixed precision for faster training

# Checkpointing
checkpoint:
  save_best_only: false
  monitor: val_auc
  mode: max