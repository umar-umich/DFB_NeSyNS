# =============================================================================
# Ablation: Spatial (CLIP) + Frequency (FAD-DINOv2) — no NeSy overhead
# =============================================================================
# Pure backbone ablation: CLIP for spatial, DINOv2-L for frequency branch.
# All neuro-symbolic modules disabled (no semantic, causal, forensic, SAE).
# =============================================================================

log_dir: /data/umar/Repos/DFB_NeSyNS/ablation_results/logs_clip_dinov2

model_name: nesydefake_hybrid
backbone_name: multi_stream

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
dataset_type: nesydefake
active_branches: ['spatial', 'frequency']

train_dataset: [FaceForensics++_augmented]
test_dataset:  [FaceForensics++, Celeb-DF-v2]
all_dataset:   [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter,
                DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC,
                DeeperForensics-1.0, UADFV]

compression: c23

# -----------------------------------------------------------------------------
# Frame configuration
# -----------------------------------------------------------------------------
video_mode: false
frame_num:
  train: 32
  test:  32

resolution:    224
with_mask:     false
with_landmark: false

load_semantic_features: false

class_weights: [0.7, 1.3]

projection_dropout:
  spatial:   0.2
  frequency: 0.1

# -----------------------------------------------------------------------------
# Data loading & augmentation
# -----------------------------------------------------------------------------
train_batchSize: 180
test_batchSize:  180
workers:         12

use_data_augmentation: true
balance_classes:       true
balance_target_ratio: 0.5

# Source-paired training (GenD, WACV 2026)
paired_training: true

data_aug:
  flip_prob:            0.5
  rotate_limit:         [-10, 10]
  affine_translate:     [0.1, 0.1]
  affine_scale:         [0.9, 1.1]
  blur_prob:            0.1
  blur_kernel_size:     7
  blur_sigma:           [0.1, 2.0]
  brightness_limit:     0.1
  contrast_limit:       0.1
  quality_lower:        40
  quality_upper:        100
  gaussian_noise_sigma: 0.0

mean: [0.5, 0.5, 0.5]
std:  [0.5, 0.5, 0.5]

# -----------------------------------------------------------------------------
# Foundation Models
# -----------------------------------------------------------------------------
foundation_models:

  spatial:
    name:            clip
    model_path:      openai/clip-vit-large-patch14
    output_dim:      1024
    freeze_backbone: true
    train_layernorms: false
    normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

  frequency:
    name:             fad_dinov2
    model_path:       facebook/dinov2-large
    output_dim:       1024
    freeze_backbone:  true
    train_layernorms: false
    fad_mode:         single
    fad_learnable:    true
    freq_emphasis_init: 0.1
    normalization:
      keep_raw:       true
    clip_normalization:
      mean: [0.481, 0.458, 0.408]
      std:  [0.269, 0.261, 0.276]

# Fusion
fusion:
  type:           attention
  fused_dim:      2048
  projection_dim: 1024
  dropout:        0.3

# -----------------------------------------------------------------------------
# Uniformity-Alignment Loss (Wang & Isola, 2020 / GenD, WACV 2026)
# -----------------------------------------------------------------------------
uniformity_alignment:
  enabled: true
  alignment_weight: 0.1
  uniformity_weight: 0.5
  l2_normalize: true

# -----------------------------------------------------------------------------
# All NeSy modules DISABLED for clean ablation
# -----------------------------------------------------------------------------
semantic_gate:
  enabled: false

semantic_attributes:
  enabled: false
  backend: precomputed
  precomputed_dim: 211
  precomputed_dir: facellava_semantic
  output_dim: 211
  model_path: /data/umar/Repos/FaceBench
  use_llm: true
  fp16: true
  micro_batch_size: 16

consistency_rules:
  enabled: false
  output_dim: 20

forensic_features:
  enabled: false
  output_dim: 83
  precomputed_dir: forensic_features

causal_intervention:
  enabled: false
  output_dim: 28
  top_k_interventions: 10
  graph_guided_alpha: 0.5
  ci_gate_init: -2.0

semantic_projection:
  enabled: false
  hidden_dim: 128
  dropout: 0.2
  gate_init: -1.0

causal_attention:
  attn_dim: 256

causal_module:
  enabled: false
  causal_warmup_batches: -1
  latent_variables:
    z_spatial_dim:    128
    z_frequency_dim:  128
    z_causal_dim:     32
  semantic_dim: 211
  dual_subgraph: true
  discovery:
    algorithm:              dagma_dce
    scm_type:               linear
    max_parents:            3
    sparsity_penalty:       0.01
    jacobian_every_n:       4
    enforce_directionality: true
  semantic_graph:
    enabled:    false
    hidden_dim: 64
    num_layers: 2
  dag_learning:
    hidden_dim:          128
    num_layers:          2
    learning_rate:       0.001
    dag_penalty_weight:  0.1

sparse_features:
  enabled: false
  per_branch: false
  dict_size: 1024
  target_k: 128
  dead_feature_window: 200
  aux_loss_coeff: 0.2
  normalize_inputs: true
  sparse_autoencoder:
    input_dim:              1024
    expansion_factor:       1
    sparsity_penalty:       0.05
    l1_coefficient:         0.001
    target_active_features: 128
  discovered_features:
    save_interpretations: true
    top_k_features:       10

# -----------------------------------------------------------------------------
# Classifier (classification only)
# -----------------------------------------------------------------------------
classifier:
  type:       multi_task
  input_dim:  1024

  tasks:
    - name:        classification
      type:        binary
      output_dim:  2
      loss_weight: 1.0

  hidden_dims: [512, 256]
  dropout:     0.3

# -----------------------------------------------------------------------------
# Loss function — classification only for ablation
# -----------------------------------------------------------------------------
loss_func:
  classification:         cross_entropy
  sparse_penalty:         l1_norm
  weights:
    classification:     1.0
    causal:             0.0
    sparse:             0.0
    causal_semantic:    0.0
    graph_divergence:   0.0

loss_warmup:
  causal:
    start_epoch: 0
    end_epoch: 15
    start_weight: 0.0
    end_weight: 0.0
  causal_fake:
    start_epoch: 0
    end_epoch: 15
    start_weight: 0.0
    end_weight: 0.0
  sparse:
    start_epoch: 0
    end_epoch: 10
    start_weight: 0.0
    end_weight: 0.0
  causal_semantic:
    start_epoch: 0
    end_epoch: 15
    start_weight: 0.0
    end_weight: 0.0
  graph_divergence:
    start_epoch: 0
    end_epoch: 15
    start_weight: 0.0
    end_weight: 0.0

# -----------------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------------
optimizer:
  type: adam
  adam:
    lr: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0001
    amsgrad: false
  module_lr:
    backbone_layernorms: 0.0001
    always_trainable:    0.0001
    phase_proj:          0.0003
    projection_heads:    0.0001
    fusion:              0.0002
    classifier:          0.0002

# -----------------------------------------------------------------------------
# Training schedule
# -----------------------------------------------------------------------------
lr_scheduler:   cosine_warmup
warmup_epochs:  2
nEpochs:        30
start_epoch:    0
save_epoch:     1
rec_iter:       100
logdir:         ./logs
manualSeed:     1024
save_ckpt:      true
save_feat:      true
grad_clip:      1.0
freq_grad_clip: 2.0

# -----------------------------------------------------------------------------
# Metrics & interpretability
# -----------------------------------------------------------------------------
metric_scoring:     auc
additional_metrics: [acc, eer, ap]

interpretability:
  save_attention_maps:      false
  save_causal_graphs:       false
  save_feature_activations: false
  save_sae_features:        false
  visualization_frequency:  500
  graph_viz_top_k:          20
  graph_viz_every_n_epochs: 5

# -----------------------------------------------------------------------------
# Hardware
# -----------------------------------------------------------------------------
cuda:            true
cudnn:           true
mixed_precision: true

checkpoint:
  save_best_only: false
  save_interval: 5
  monitor:        val_auc
  mode:           max

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.001
